name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # 每周日 0 点 UTC（仅触发 fuzz job）

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-junit-report
        run: cargo install cargo-junit-report --force
      - name: Prepare test results directory
        shell: bash
        run: mkdir -p test-results
      - name: Test asd-domain
        shell: bash
        run: cargo test -p asd-domain 2>&1 | cargo junit-report --output test-results/asd-domain.xml || true
      - name: Test asd-ipc-protocol
        shell: bash
        run: cargo test -p asd-ipc-protocol 2>&1 | cargo junit-report --output test-results/asd-ipc-protocol.xml || true
      - name: Test asd-test-harness
        shell: bash
        run: cargo test -p asd-test-harness 2>&1 | cargo junit-report --output test-results/asd-test-harness.xml || true
      - name: Test asd-application
        shell: bash
        run: cargo test -p asd-application 2>&1 | cargo junit-report --output test-results/asd-application.xml || true
      - name: Test asd-tauri
        shell: bash
        run: cargo test -p asd-tauri --lib 2>&1 | cargo junit-report --output test-results/asd-tauri.xml || true
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 90

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate lcov coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Generate HTML coverage
        run: cargo llvm-cov --workspace --html --output-path coverage.html
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  ahk-test:
    name: AHK Executor Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        run: |
          choco install autohotkey --version=2.0.0 -y
          # 验证安装
          $ahkPath = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"
          if (-not (Test-Path $ahkPath)) {
            $ahkPath = "C:\Program Files\AutoHotkey\v2\AutoHotkey.exe"
          }
          Write-Host "AutoHotkey path: $ahkPath"
          & $ahkPath /ErrorStdOut /help | Select-Object -First 1

      - name: Run AHK tests
        working-directory: ${{ github.workspace }}
        run: |
          $ahkPath = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"
          if (-not (Test-Path $ahkPath)) {
            $ahkPath = "C:\Program Files\AutoHotkey\v2\AutoHotkey.exe"
          }
          $proc = Start-Process -FilePath $ahkPath `
            -ArgumentList "tests\run_all_tests.ahk" `
            -WorkingDirectory "${{ github.workspace }}" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "ahk-test-output.txt" `
            -RedirectStandardError "ahk-test-error.txt"
          Write-Host "Exit code: $($proc.ExitCode)"
          Get-Content "ahk-test-output.txt"
          if (Test-Path "ahk-test-error.txt") {
            Write-Host "=== STDERR ==="
            Get-Content "ahk-test-error.txt"
          }
          if ($proc.ExitCode -ne 0) {
            exit 1
          }

      - name: Parse test results
        if: always()
        run: |
          $output = Get-Content "ahk-test-output.txt" -Raw
          $passCount = ([regex]::Matches($output, "PASS:")).Count
          $failCount = ([regex]::Matches($output, "FAIL:")).Count
          Write-Host "=== AHK Test Summary ==="
          Write-Host "Passed: $passCount"
          Write-Host "Failed: $failCount"
          if ($failCount -gt 0) {
            Write-Host "::warning::AHK 测试有 $failCount 个失败"
            # 不阻塞 CI（pre-existing 失败可接受）
          }

      - name: Upload AHK test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ahk-test-logs
          path: |
            ahk-test-output.txt
            ahk-test-error.txt
          retention-days: 30

  miri:
    name: Miri UB Check
    runs-on: ubuntu-latest
    continue-on-error: true  # 允许失败以渐进式修复
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly + Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo +nightly miri --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri

      - name: Run Miri on asd-domain
        working-directory: asd-tauri
        run: cargo +nightly miri test -p asd-domain

      - name: Run Miri on asd-ipc-protocol
        working-directory: asd-tauri
        run: cargo +nightly miri test -p asd-ipc-protocol

      - name: Run Miri on asd-application
        working-directory: asd-tauri
        run: cargo +nightly miri test -p asd-application -- --skip config_repository --skip save_config --skip load_from

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    # 仅在 cron 触发时运行，不阻塞常规 CI
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup override set nightly
          cargo install cargo-fuzz --locked

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri/src-tauri

      - name: Run fuzz_config_deserialize
        working-directory: asd-tauri/src-tauri/fuzz
        run: cargo +nightly fuzz run fuzz_config_deserialize -- -max_total_time=600

      - name: Run fuzz_ipc_message_parse
        working-directory: asd-tauri/src-tauri/fuzz
        run: cargo +nightly fuzz run fuzz_ipc_message_parse -- -max_total_time=600

      - name: Run fuzz_hotkey_merger
        working-directory: asd-tauri/src-tauri/fuzz
        run: cargo +nightly fuzz run fuzz_hotkey_merger -- -max_total_time=600

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: asd-tauri/src-tauri/fuzz/artifacts/
          retention-days: 30

  bench:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true  # 不阻塞
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri

      - name: Run benchmarks
        working-directory: asd-tauri/src-tauri
        run: cargo bench -- --save-baseline current

      - name: Compare with baseline
        working-directory: asd-tauri/src-tauri
        run: |
          if [ -f benches/baseline.json ]; then
            echo "=== Comparing with baseline ==="
            # 使用 critcmp 或自写脚本对比
            cargo install critcmp --locked 2>/dev/null || true
            critcmp baseline current || echo "::warning::无法对比基准，可能是首次运行或 critcmp 不可用"
          else
            echo "::notice::首次运行，保存当前结果为基线"
            cp target/criterion/current benches/baseline.json || true
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: asd-tauri/src-tauri/target/criterion/
          retention-days: 30
