[package]
name = "asd-tauri-fuzz"
version = "0.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
asd-domain = { path = "../../crates/asd-domain" }
asd-ipc-protocol = { path = "../../crates/asd-ipc-protocol" }
serde_json = "1.0"

[[bin]]
name = "fuzz_ipc_json"
path = "fuzz_targets/fuzz_ipc_json.rs"

[[bin]]
name = "fuzz_config_deserialize"
path = "fuzz_targets/fuzz_config_deserialize.rs"

[[bin]]
name = "fuzz_ipc_command"
path = "fuzz_targets/fuzz_ipc_command.rs"
