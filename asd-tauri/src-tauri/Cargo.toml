[package]
name = "asd-tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "asd_tauri_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "asd-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
asd-domain = { path = "../crates/asd-domain" }
asd-ipc-protocol = { path = "../crates/asd-ipc-protocol" }
asd-application = { path = "../crates/asd-application" }
tauri = { version = "2.11.2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "1", features = ["full"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
getrandom = "0.2"

[dev-dependencies]
criterion = "0.5"
asd-test-harness = { path = "../crates/asd-test-harness" }
serial_test = "3"
regex = "1"

[[bench]]
name = "benchmarks"
harness = false

# ── lint 配置（TD-045）───────────────────────────────────────────────
#
# 本 crate 是入口层 / Tauri 样板，**刻意不**用 `[lints] workspace = true` 继承：
# pedantic 全开实测 618 项，其中 425 项是文档类（doc_markdown 265 /
# missing_errors_doc 158 / missing_panics_doc 2），一次放开等于把真信号淹掉。
# 改为**显式清单 + 逐批开启**：每批只把一个 lint 从 allow 翻成默认（删该行），
# 修干净再开下一个。已开启的由 G2b（`cargo clippy --workspace --all-targets
# -- -D warnings`）守住，回归即红 —— 这条闸门本身就是防复发机制。
#
# 终态：全部收干后换成 `[lints] workspace = true`，与纯逻辑 crate 统一策略。
# ⚠️ 在那之前，根 `Cargo.toml` 的 `[workspace.lints]` 调整**不会**自动传导到本 crate。
#
# `priority = -1` 是必需的：否则逐条 allow 与 pedantic 组同优先级，
# 谁生效由定义顺序决定，容易写错。
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# ——— 文档类（425 项）：TD-045 分批补，先关 ———
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# ——— 非文档类：按批开启，进度见台账 TD-045 ———
# ⚠️ 数字口径：以下均为**去重后**的告警数。`cargo clippy --all-targets` 会把同一条
#    告警在 lib / test 两个 target 各报一遍，必须按 (lint, 文件, 行, 列) 去重后再数。
#    台账 TD-045 最初登记的「618 项 / 文档类 425 / 非文档类 193」是**未去重**的原始
#    计数，去重后真实为「约 430 / 290 / 140」，2026-09-17 已订正。
#
# 批次 1 ✅（2026-09-17）：uninlined_format_args 59 项
# 批次 2 ✅（2026-09-17）：must_use_candidate 20 项
# 批次 3 ✅（2026-09-17）：零散可自动修 ~27 项（map_unwrap_or / unnested_or_patterns /
#     single_match_else / redundant_closure_for_method_calls / cloned_instead_of_copied /
#     needless_continue / unreadable_literal / format_push_string / match_same_arms /
#     semicolon_if_nothing_returned / items_after_statements /
#     match_wildcard_for_single_variants / duration_suboptimal_units）
# 批次 4 ✅（2026-09-17）：时间戳减法 4 + 指针转换 2 + unused_async 1
# 批次 5 ⬜：needless_pass_by_value 11 项（动签名，风险最高，需逐个确认语义）
# 批次 6 ⬜：cast_* 12 项（逐个判断「改写法」还是「登记豁免 + 理由」）
# 批次 7 ⬜：too_many_lines 3 项（真重构，先补测试再动刀）
# 批次 8 ⬜：文档类 290 项（doc_markdown 210 / missing_errors_doc 79 / missing_panics_doc 1）
needless_pass_by_value = "allow"
too_many_lines = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
