[package]
name = "asd-tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "asd_tauri_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "asd-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
asd-domain = { path = "../crates/asd-domain" }
asd-ipc-protocol = { path = "../crates/asd-ipc-protocol" }
asd-application = { path = "../crates/asd-application" }
tauri = { version = "2.11.2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "1", features = ["full"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
getrandom = "0.2"

[dev-dependencies]
criterion = "0.5"
asd-test-harness = { path = "../crates/asd-test-harness" }
serial_test = "3"
regex = "1"

[[bench]]
name = "benchmarks"
harness = false

# ── lint 配置（TD-045）───────────────────────────────────────────────
#
# 本 crate 是入口层 / Tauri 样板，**刻意不**用 `[lints] workspace = true` 继承：
# pedantic 全开约 433 项（去重后），其中 293 项是文档类（doc_markdown 213 /
# missing_errors_doc 79 / missing_panics_doc 1），一次放开等于把真信号淹掉。
# （doc_markdown 的 213 是 2026-09-17 批次 9 实测的去重数；台账早先记的 211 是
#  批次 8 补 `# Errors` 之前的旧口径，勿再引用。）
# （618 / 425 是**未去重**的旧数字，`--all-targets` 会把同一条报两遍，勿再引用。）
# 改为**显式清单 + 逐批开启**：每批只把一个 lint 从 allow 翻成默认（删该行），
# 修干净再开下一个。已开启的由 G2b（`cargo clippy --workspace --all-targets
# -- -D warnings`）守住，回归即红 —— 这条闸门本身就是防复发机制。
#
# 终态：全部收干后换成 `[lints] workspace = true`，与纯逻辑 crate 统一策略。
# ⚠️ 在那之前，根 `Cargo.toml` 的 `[workspace.lints]` 调整**不会**自动传导到本 crate。
#
# `priority = -1` 是必需的：否则逐条 allow 与 pedantic 组同优先级，
# 谁生效由定义顺序决定，容易写错。
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 批次 7 的 2 项豁免（理由/前置条件/到期日见上方批次 7 注释）
too_many_lines = "allow"

