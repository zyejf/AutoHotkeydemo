[workspace]
resolver = "2"
members = [
    "crates/asd-domain",
    "crates/asd-ipc-protocol",
    "crates/asd-application",
    "crates/asd-test-harness",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

# ── lint 配置（TD-012）───────────────────────────────────────────────
#
# 只对 **纯逻辑 crate** 生效（asd-domain / asd-ipc-protocol / asd-application /
# asd-test-harness），它们各自 Cargo.toml 里有 `[lints] workspace = true`。
# `src-tauri` **不承接**，改为自己的显式清单逐批开启（TD-045）。不一次放开的原因：
# 承接后共约 **430 项**告警（去重后口径 —— `--all-targets` 会把同一条在 lib / test
# 各报一遍，按 (lint, 文件, 行, 列) 去重；未去重的原始计数是 618，勿再引用），
# 其中 **290 项是文档类**（doc_markdown 210 / missing_errors_doc 79 /
# missing_panics_doc 1），大量是 Tauri 样板代码的文档噪声，一次放开等于把真信号淹掉。
# ⚠️ 也别指望 `[lints.clippy] workspace = true` 这种 per-tool 继承：本仓库的 cargo
# 不接受（报 `invalid type: boolean true, expected a string or map`）。
# 进度与每批的做法见 `src-tauri/Cargo.toml` 的 `[lints.clippy]` 段与台账 TD-045。
#
# `priority = -1` 是为了让下面逐条的 allow 能盖住 pedantic（否则同级别下
# 组 lint 与单条 lint 的优先级由定义顺序决定，容易写错）。
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# —— TD-021：2026-09-16 起由 allow 改为 **warn**（分阶段收紧）——
# 已补齐的 crate 立刻受保护：新增公开函数不写失败契约就会红。
# 尚未补齐的一处在各自 crate 根显式 allow 并注明理由，**不要在这里改回 allow**：
#   · asd-test-harness：测试辅助函数 panic 是预期行为，不是生产契约
# ✅ asd-application 已于 2026-09-16 **全量补齐**（55 条 `# Errors`，按文件分批推进、
#    补完一个文件删一个文件头 allow；进度与发现的真信号见台账 TD-021）。
# ⚠️ 当初 allow 的理由是「一次性放开会淹没其它 lint 的真信号」——
#    这个顾虑对已收干的 crate 不再成立。`src-tauri`（约 430 项 / 文档类 290）走
#    自己的显式清单分批开启，不吃 workspace lints，故本段对它无效。
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
