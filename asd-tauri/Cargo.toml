[workspace]
resolver = "2"
members = [
    "crates/asd-domain",
    "crates/asd-ipc-protocol",
    "crates/asd-application",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
