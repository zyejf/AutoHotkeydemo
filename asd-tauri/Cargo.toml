[workspace]
resolver = "2"
members = [
    "crates/asd-domain",
    "crates/asd-ipc-protocol",
    "crates/asd-application",
    "crates/asd-test-harness",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# ── lint 配置（TD-012）───────────────────────────────────────────────
#
# 只对 **纯逻辑 crate** 生效（asd-domain / asd-ipc-protocol / asd-application /
# asd-test-harness），它们各自 Cargo.toml 里有 `[lints] workspace = true`。
# `src-tauri` **不承接**：那里 587 项 pedantic 告警里 476 项是 Tauri 样板代码的
# 文档类噪声，开了等于把真信号淹掉 —— 先守住业务逻辑，再谈入口层。
#
# `priority = -1` 是为了让下面逐条的 allow 能盖住 pedantic（否则同级别下
# 组 lint 与单条 lint 的优先级由定义顺序决定，容易写错）。
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# —— TD-021：2026-09-16 起由 allow 改为 **warn**（分阶段收紧）——
# 已补齐的 crate 立刻受保护：新增公开函数不写失败契约就会红。
# 尚未补齐的两处在各自 crate 根显式 allow 并注明理由，**不要在这里改回 allow**：
#   · asd-application：51 条，按文件分批（见台账 TD-021）
#   · asd-test-harness：测试辅助函数 panic 是预期行为，不是生产契约
# ⚠️ 当初 allow 的理由是「59 条一次性放开会淹没其它 lint 的真信号」——
#    这个顾虑对 **asd-application 的 51 条**仍然成立，对已经收干的 crate 不再成立。
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
