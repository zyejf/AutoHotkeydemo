name: CI

# DoD 四闸门（gates job，windows-latest，任一红即失败）：
#   G1 图谱基线（无新增环 / 无白名单外依赖违规）
#   G2 cargo fmt + clippy 零告警
#   G3 测试通过且已登记（cargo / AHK / JS + test-map.md 数字对账）
#   G4 文档同步（人工核对，CI 只输出清单）
# 本地等价入口：scripts/check-gates.ps1 或 scripts/check-gates.sh
#
# 其余 job（coverage / miri / fuzz / bench）为辅助质量信号，均 continue-on-error，
# 不阻塞合并。⚠️ 例外：**ahk-bench 是门禁，不是信号** —— 它跑 AHK 生产基准
# （tools/ahk-bench/gate.py），超过基线 ×K 即失败并阻断合并，用于守住 T1/T6 的收益。
# 平台选择（踩过坑，勿随意改）：
#   - miri / fuzz：依赖 nightly 且 Windows 支持不佳 → ubuntu
#   - coverage：只覆盖纯逻辑 crate（Linux 可编译）→ ubuntu
#   - bench：位于 src-tauri，Linux 需 glib/GTK 系统库才能构建 → windows-latest
#
# 历史说明：本文件曾位于 asd-tauri/.github/workflows/ci.yml。GitHub Actions 只读取
# **仓库根目录**的 .github/workflows，子目录那份从未被执行过，已迁移至此并修复
# working-directory 缺失、cargo fmt --all -- --check 写法错误等问题。

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # 每周日 0 点 UTC，仅触发 fuzz job
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '同时运行 E2E（需 WebView2 + tauri-driver + msedgedriver，CI 上不稳定，默认关闭）'
        type: boolean
        default: false
      update_ahk_bench_baseline:
        description: '重设 AHK 生产基准基线：在 CI 上跑满轮数并把新的 baselines.json 作为 artifact 上传（下载后人工确认再提交）'
        type: boolean
        default: false
      e2e_spec:
        description: 'E2E 只跑指定 spec（相对 asd-tauri/e2e 的路径，如 specs/smoke.spec.js）；留空则跑全量。诊断轮建议填 specs/smoke.spec.js（约 1 分钟出结论）'
        type: string
        required: false
        default: ''
      e2e_timeout_ms:
        description: '诊断用：放宽 /session 超时（毫秒）以换取被超时吃掉的真正错误串，留空则用默认 60s。用途是区分「webviewOptions 没生效」与「生效了但后面还有别的阻塞」—— run 35343866509 实测 60s 超时先触发，真实错误串一次都没出现'
        type: string
        required: false
        default: ''
      e2e_build_config:
        description: 'E2E 专用 Tauri 配置（相对 asd-tauri 的路径，如 src-tauri/tauri.e2e.conf.json）。留空=用正式配置构建。**方案 1 已证伪（run 35354358075），默认必须为空** —— 非空会让构建出的二进制带 --remote-debugging-port，是安全红线'
        type: string
        required: false
        default: ''
      build_release:
        description: '构建发布安装包（NSIS exe + SHA256）并作为 artifact 上传，供发布与事后回滚取用（TD-074）。⚠️ 默认关闭：该构建路径在 CI 上**从未被真正跑通过**（e2e job 结构性不可达，内含的构建步骤一次都没执行），首次请手动勾选验证，绿过一次再考虑接自动触发'
        type: boolean
        default: false
      publish_release:
        description: '⚠️ 真实发版：创建 GitHub Release 并上传安装包（runner 用 GITHUB_TOKEN 经 API 建远端 tag，**不可逆**）。需同时勾选 build_release；首次执行**不要勾**（先把构建路径跑绿）'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag。留空自动生成 build-<YYYYMMDD>-<sha7>。⚠️ 禁止填 v0.1.0（指向 2026-06-28 旧提交，落后 HEAD 363 个提交）'
        type: string
        required: false
        default: ''

concurrency:
  # ⚠️ group 里叠加 `-${{ github.event_name }}` 是**实测驱动**的改动，不是洁癖：
  #   实测最近 50 次运行，结论为 `cancelled` 的有 **4 次 push + 1 次 workflow_dispatch**
  #   —— 即 `cancel-in-progress: true` 确实在取消 main 上**正在跑**的 run。
  #   对 release job 这意味着：发布构建跑到一半时，任何人 push 一下 main 就会把它杀掉，
  #   而发布是最不该被无关提交打断的东西。拆成 push / dispatch 两组后二者互不干扰。
  #   仍按 `${{ github.ref }}` 分组 —— **不是**静态组名（静态会把所有分支的 CI 串行化，
  #   那是回归）。group 表达式只允许 github / inputs / vars 三个上下文（GitHub 文档），
  #   `event_name` 属 github 上下文，合法。
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Windows runner 上 Python 的 stdio 默认用系统 ANSI 代码页（cp1252），
  # 脚本 print 中文会抛 UnicodeEncodeError，且子进程输出按 cp1252 解码会乱码。
  # 开启 UTF-8 模式后 stdio 与默认编码统一为 utf-8（Python 3.7+）。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ============================================================ 四闸门
  gates:
    name: 四闸门 (windows-latest)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JS 单测只用 node 内置模块，无需 npm ci（省去安装前端依赖的时间）

      - name: 安装 AutoHotkey v2
        id: ahk
        # 注意：该 action 只发布了 v2.1.0 / v2.0.0 等具体标签，**没有 `v2` 浮动标签**
        # （v1 才有）。写 @v2 会在 "Set up job" 阶段直接失败：unable to find version。
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          # tauri.conf.json 的 bundle.resources 声明了 ahk_executor/AutoHotkey64.exe
          # （路径相对 src-tauri）。该 exe 被 .gitignore 的 `*.exe` 排除，全新 clone
          # 里并不存在，src-tauri 的 build.rs 会直接失败：
          #   resource path `ahk_executor\AutoHotkey64.exe` doesn't exist
          # 本地之所以不明显，是因为 build.rs 有缓存指纹、不会重跑。
          # CI 上把上一步装好的 AHK 复制过去，等价于开发者本地放置该文件。
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          } else {
            Write-Host "AHK 运行时已存在，跳过: $dst"
          }

      - name: 安装版本化 git 钩子
        shell: pwsh
        run: .\scripts\install-hooks.ps1

      # ------------------------------------------------------------ G1
      - name: 'G1 图谱基线'
        run: python scripts/check-graph-baseline.py

      # G3i：build_graph.py 的 JS 边归类自检（TD-051，30 用例）。紧挨 G1，
      # 因为它验的正是 G1 依赖的程序本身。⚠️ `--selftest` 不能丢：丢了会去跑
      # build_ahk/rust/js 全量建图、退出码同样是 0 —— 自检没跑却显示 ✓。
      - name: 'G3i build_graph.py JS 边归类自检（--selftest）'
        run: python .review-analysis/build_graph.py --selftest

      # ------------------------------------------------------------ G2
      - name: 'G2a cargo fmt --all --check'
        working-directory: asd-tauri
        run: cargo fmt --all --check

      - name: 'G2b cargo clippy --workspace --all-targets -- -D warnings'
        working-directory: asd-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ------------------------------------------------------------ G3
      - name: 'G3a cargo test --workspace'
        working-directory: asd-tauri
        run: cargo test --workspace

      # watchdog 进程生命周期用例覆盖 start_child_process / crash_restart /
      # restart_limit / graceful_shutdown 等路径 —— 这些路径一旦回归，表现是
      # 「按键静默失效」而**没有任何红灯**。
      # 原排除理由写的是「避免在 CI 中运行慢测试」，但 2026-09-18 在当前 HEAD 实测：
      # 15 passed / 0 failed / finished in 13.39s —— 理由不成立（且不算慢）。
      # 故 15 条 `#[ignore]` 已于 2026-09-19 摘除，它们现在随 `cargo test --workspace`
      # 在**阻断的** G3a 里跑。
      #
      # ⚠️ 2026-09-19 实测：摘除之后，本步骤原先的 `--ignored` 筛选**已选不到任何用例**
      #   （`cargo test -p asd-tauri --lib -- --ignored --list` = 0 tests、rc=0）。
      #   叠加 `continue-on-error` 后它退化成「恒绿空转」—— 绿，但一条都没跑过。
      #   故改为**按模块名直接跑这组用例**并保留 `--test-threads=1`：真实进程用例
      #   （起 `cmd.exe` / taskkill）在共享 runner 上比本机更易抖，串行跑是为采集抖动
      #   证据，**不是为了阻断**（`continue-on-error` 维持不变）。
      # ⚠️ 必须带 CARGO_INCREMENTAL=0：否则 rustc 可能 ICE（退出码 101），会被误读成测试失败。
      # 解禁判据（2026-09-19 三处已统一为最严口径）：本机与 CI 各连续 **≥10 次全绿**
      #   （含 `--test-threads=1`）后，才可摘掉本步骤的 `continue-on-error` 转硬门禁。
      #   ⚠️ 三处是 `ci.yml`（本段）/ `watchdog_integration_tests.rs` 文件头 /
      #   `docs/guard-effectiveness-checklist.md`；由 `scripts/check-test-map.py` 的
      #   **F2 段**机器校验，任一处改小即红、改一处不同步也红 —— 别再各写一套。
      - name: 'G3h watchdog 进程生命周期（串行，观测期不阻断）'
        working-directory: asd-tauri
        env:
          CARGO_INCREMENTAL: '0'
        continue-on-error: true
        run: cargo test -p asd-tauri --lib tests::watchdog_integration_tests -- --test-threads=1

      - name: 'G3b AHK 完整测试套件'
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
          # 关闭「宿主时延类断言」（SenderPreciseTimingTests 里 7 条绝对墙钟时延用例）。
          # 定刻走 QPC 忙等，共享 runner 的 CPU 争用会直接把它打穿 —— 实测 CI 上
          # SleepUntil p95=11.15ms（阈值 5）、periodic 端到端 p95=31.86ms（阈值 20），
          # 且按插值其中位数也已越线，属宿主争用而非实现回归。放宽阈值测不出回归，
          # 硬判则必然 flaky，故 CI 显式跳过；跳过的条数会打进下面的汇总，不会静默消失。
          # 本机四闸门（scripts/check-gates.sh）不设此变量，7 条照跑。
          ASD_HOST_TIMING: '0'
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ahk-gate.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'ahk-gate.err.log'
          $resultLog = "tests/test_results.log"

          # AutoHotkey64.exe 是 GUI 子系统程序。用 `& $exe ...` 调用时 PowerShell
          # **不会等待**它结束，$LASTEXITCODE 也不会被设置 —— 实测表现为日志 0 字节、
          # 退出码为空。必须 Start-Process -Wait -PassThru 才能拿到真实退出码。
          $p = Start-Process -FilePath $env:AHK_EXE `
            -ArgumentList @('tests/run_all_tests.ahk') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $errLog
          $exit = $p.ExitCode

          # 显式指定 utf8：Windows runner 上 Get-Content 否则按系统 ANSI 代码页解码，
          # 中文汇总行会乱码，导致下面的正则匹配不到而误判为「无法解析」。
          # 另外不要依赖自动变量 $Matches 取值：左操作数为 $null 或数组时它不会被填充，
          # 实测会走到 "Cannot index into a null array" 而不是这里的报错分支。
          # 统一用 [regex]::Match 显式取分组；$text 先初始化为 '' 避免 $null 参与比较。
          # 汇总以 tests/test_results.log 为准（runner 自己写的），stdout 只是兜底
          $text = ''
          if (Test-Path $resultLog) { $text = [string](Get-Content $resultLog -Raw -Encoding utf8) }
          if ($text -notmatch '总计:' -and (Test-Path $log)) {
            $text = [string](Get-Content $log -Raw -Encoding utf8)
          }

          # 诊断：AHK 是否真的跑起来，先看退出码与三份日志的字节数
          Write-Host "AHK 退出码: $exit"
          Write-Host "test_results.log 字节: $((Get-Item $resultLog -ErrorAction SilentlyContinue).Length)"
          Write-Host "ahk-gate.log 字节: $((Get-Item $log -ErrorAction SilentlyContinue).Length)"
          Write-Host "ahk-gate.err.log 字节: $((Get-Item $errLog -ErrorAction SilentlyContinue).Length)"
          Write-Host "--- ahk-gate.err.log 尾部 ---"
          if (Test-Path $errLog) { Get-Content $errLog -Tail 20 -Encoding utf8 }
          Write-Host "--- ahk-gate.log 尾部 ---"
          if (Test-Path $log) { Get-Content $log -Tail 40 -Encoding utf8 }
          Write-Host "--- test_results.log 尾部 ---"
          if (Test-Path $resultLog) { Get-Content $resultLog -Tail 20 -Encoding utf8 }

          $m = [regex]::Match($text, '总计:\s*(\d+)[\s\S]*?通过:\s*(\d+)[\s\S]*?失败:\s*(\d+)')
          if (-not $m.Success) {
            throw "无法解析 AHK 结果汇总（未找到 总计/通过/失败）。AHK 退出码=$exit"
          }
          $total = [int]$m.Groups[1].Value
          $pass  = [int]$m.Groups[2].Value
          $fail  = [int]$m.Groups[3].Value
          # 跳过数可选（旧格式没有这一行）：取不到就按 0 处理，不影响主判定
          $ms = [regex]::Match($text, '跳过:\s*(\d+)')
          $skip = 0
          if ($ms.Success) { $skip = [int]$ms.Groups[1].Value }
          Write-Host "AHK 汇总: 总计 $total / 通过 $pass / 失败 $fail / 跳过 $skip"
          if ($total -eq 0) { throw 'AHK 总计为 0，测试未实际运行' }
          if ($fail -gt 0) { throw "AHK 测试失败 $fail 个" }
          # 跳过必须可见：本 job 固定关掉 7 条宿主时延断言，若一条都没跳过说明
          # 门控失效（环境变量没传进去 / 用例被改名），那才是要报的问题。
          if ($skip -eq 0) {
            throw "预期跳过 7 条宿主时延断言（ASD_HOST_TIMING=0），实际 0 条 —— 门控可能失效"
          }

      - name: 'G3c JS 单元测试'
        working-directory: asd-tauri
        shell: pwsh
        run: |
          # 不能用 `node --test <目录>`：会被 node 当成 CJS 模块去 require
          # 两处：e2e 辅助模块的测试 + 前端 src/ 的测试（TD-005 起有 src/__tests__）
          $files = @(
            Get-ChildItem -Path 'e2e/helpers/__tests__' -Filter *.test.js | ForEach-Object { $_.FullName }
            Get-ChildItem -Path 'src/__tests__'         -Filter *.test.js | ForEach-Object { $_.FullName }
          )
          if ($files.Count -eq 0) { throw '未找到任何 *.test.js' }
          node --test @files

      - name: 'G3d test-map.md 登记对账'
        run: python scripts/check-test-map.py

      # 静态检查，约 2.5s。C1a/C1b/C1c/C2/C3b 走棘轮（只阻新增），C3 恒 0 硬阻断。
      # 依赖 .review-analysis/tech-debt-baseline.json（已入库）。
      - name: 'G3e 技术债度量（C1 孤儿 / C2 未接入 / C3 文档漂移 / C3b 硬写数字 / C13 台账结构自洽）'
        run: python scripts/check-tech-debt.py

      # tests/ 下 7 个独立脚本，不在 run_all_tests.ahk 的套件注册里，历史上从未被
      # 任何 runner 执行过 —— 2026-09-16 首次接入执行就连挖三个生产 BUG（TD-034/035/036），
      # 随后 TD-037 又挖出两个。不进门禁，它们会继续腐烂。
      - name: 'G3g AHK 独立脚本（tests/test_*.ahk，逐个按退出码汇总）'
        shell: bash
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: bash scripts/run-standalone-ahk-tests.sh

      # ------------------------------------------------------------ G4
      - name: 'G4 文档同步（人工核对清单）'
        shell: pwsh
        run: |
          Write-Host '以下项目无法自动校验，请在评审时人工确认：'
          Write-Host '  [ ] AGENTS.md 架构/分层/妥协白名单是否同步'
          Write-Host '  [ ] asd-tauri/docs/test-map.md 测试数是否更新（G3d 已校验数字自洽）'
          Write-Host '  [ ] docs/developer-guide.md 命令与排障是否同步'
          Write-Host '  [ ] docs/graph-driven-workflow.md 流程是否同步'
          Write-Host '  [ ] 新增 crate / 跨 crate 依赖是否同步 ALLOWED_CRATE_DEPS'
          Write-Host '  [ ] 清理了技术债后是否 --update-baseline 收紧水位（基线 diff 须出现在本 CR）'

  # 独立 job：只需要 checkout + node + npm ci，与主 job 的 Rust 构建并行，
  # 不占用主 job 的关键路径（放主 job 里要多等一次 npm ci）。
  js-lint:
    name: 前端 lint（ESLint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'npm ci'
        working-directory: asd-tauri
        run: npm ci
      # 水位 0（TD-022 已清零，2026-09-17）：存量 69 项全清，eslint.config.js 里那三条
      # 降级覆盖也撤了 —— no-redeclare / no-empty / no-prototype-builtins 回到
      # recommended 的 error 级。现在**新增任何一处都立刻红**，不需要再靠数字棘轮兜。
      - name: 'eslint（--max-warnings 0，新增即 FAIL）'
        working-directory: asd-tauri
        run: npm run lint

  # ============================================================ 辅助（不阻塞）
  coverage:
    name: Coverage（纯逻辑 crate）
    runs-on: ubuntu-latest
    # ⚠️ TD-006 起本 job 是**阻断**的（原为 continue-on-error + 仅 push 时跑），
    #    因为「无阈值、非阻断」的覆盖率等于没有覆盖率门禁。
    #    为让它稳定到可以阻断，cargo-llvm-cov 改用预编译二进制（install-action）：
    #    `cargo install` 的编译耗时与偶发网络失败会把无关原因变成红灯，
    #    而「红灯与代码无关」正是门禁被全员忽略的最快路径。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - name: 安装 cargo-llvm-cov（预编译二进制）
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: 生成 lcov
        working-directory: asd-tauri
        # 只覆盖三个纯逻辑 crate。workspace 里的 src-tauri 依赖 windows / tauri 系列
        # crate，在 Linux 上无法编译（windows-future 报 E0425），`--workspace` 必失败；
        # 纯逻辑 crate 按分层规则不引入 tauri / tokio / interprocess / windows，可安全跑。
        run: |
          mkdir -p coverage
          cargo llvm-cov --package asd-domain --package asd-ipc-protocol --package asd-application --lcov --output-path coverage/lcov.info
      # 棘轮门禁：整体容差 0.5pp、单文件 2.0pp，只阻下降不阻上升。
      # 基线在本机（Windows）实测；若 CI（ubuntu）因 cfg 分支系统性偏离，
      # 下载本 job 的 coverage-report artifact 重跑一次 --update-baseline 校准即可。
      - name: 'G3f 覆盖率门禁（棘轮：下降即 FAIL）'
        run: python scripts/check-coverage.py --lcov asd-tauri/coverage/lcov.info
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: asd-tauri/coverage/lcov.info
          retention-days: 30

  security-audit:
    name: 依赖安全审计（TD-014）
    runs-on: ubuntu-latest
    # ⚠️ 必须显式开 checks: write。默认 GITHUB_TOKEN 没有这个权限，
    # rustsec/audit-check 在**最后一步**把结果写回 Checks API 时会报
    #   Resource not accessible by integration
    # 而**审计本身其实是跑完了的** —— 于是 job 红了、日志里却只看到一句权限错误，
    # 极容易被误读成「action 配置坏了」或者「没装成功」。2026-09-16 run 35113576002 实测。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      # ---- npm：生产依赖阻断，dev 依赖只报告 ----
      #
      # 为什么要分开：生产依赖进交付物，有 CVE 就该拦；dev 依赖不进交付物，
      # 且 `npm audit fix` 常常需要 breaking change —— 一刀切阻断的结果不是
      # 「大家去修依赖」，而是「把这个 job 关掉」。
      # 所以 dev 这边只把数字打进日志（不静默），存量漏洞单独登记排期（TD-020）。
      #
      # ⚠️⚠️ 2026-09-19 实测归因（推翻了「某个提交导致恒红」的说法）：
      #   **本 step 不是恒红，是间歇红。** 同一份 package-lock.json 下，
      #   2026-09-19 当天 14:33–17:00 连续 12 次绿、17:15 与 17:20 两次红、
      #   17:42 又绿。⇒ 与代码无关，也与「提交」无关。
      #
      #   根因链条（读 npm 源码 + CI 日志取证，不是推测）：
      #   ① `@npmcli/arborist/lib/audit-report.js` 的 `_getReport` **先** POST
      #      bulk 端点 `/-/npm/v1/security/advisories/bulk`，**只有它失败时**才
      #      兜底到 `/-/npm/v1/security/audits/quick`（本机 npm 10.9.7 源码
      #      :323 / :336）。⇒ runner 并不是「还在用旧端点」，quick 只是**兜底**。
      #      因此「升级 npm 就能改用 bulk 端点」这个修法**不成立** —— 10.9.8
      #      （actions/runner-images Ubuntu2404 Readme 文档值；本 step 对每个目录
      #      各打一次 `npm --version` 实测，可复核）首选就已经是 bulk。
      #   ② quick 端点已下线，恒返回 400（响应头 `npm-notice: This endpoint is
      #      being retired...` 被 `npm-registry-fetch/lib/check-response.js:14-16`
      #      打印成 `npm notice`，所以日志里先看到 notice 再看到 400）。
      #   ③ `make-fetch-happen/lib/remote.js:82-87` 的判据是
      #      `req.method !== 'POST' && (408|420|429|>=500)` —— **POST 一律不重试**。
      #      ⇒ bulk 端点一抖动（限流 / 5xx / 网络），npm **不会自愈**，直接掉进
      #      已下线的 quick，必然 400 ⇒ 硬红。`--fetch-retries` 同样无效（POST
      #      根本不进重试分支）。这正是「间歇」而非「恒红」的成因：bulk 平时是好的。
      #
      #   修法（最小、且不动阻断级别）：**只对「审计端点自身故障」重试**，真漏洞
      #   绝不重试。判据是输出里出现 `audits/quick` 或 `audit endpoint returned
      #   an error` —— 漏洞报告里没有这两串。若把真漏洞也一起重试，等于把
      #   「有高危 CVE」伪装成「等等再看」，那是比红灯脱敏更坏的降级。
      #   三次都失败 → **仍然红灯（保持阻断）**，因为「查不动」不等于「没问题」；
      #   本仓规矩是不静默变绿（与 coverage job 的同类取舍一致）。
      #
      # ⚠️ 2026-09-20 结构：两个目录（`asd-tauri` / `asd-tauri/e2e`）合并成**一个**
      #   step。两条理由，都不是为了少写几行：
      #   ① 端点故障判定串与重试逻辑**只此一份**。此前是两个逐字复制的 step，
      #      只改一处就会漂 —— 正是 C10（三处门禁档位一致）要防的那类口径漂移。
      #      现在判定收进 `is_audit_endpoint_failure()`，那两个字面量只出现一次。
      #   ② 原先两个 step 串行，**第一个红了第二个就根本不执行**：前端目录一旦有
      #      真漏洞，E2E 目录的审计结果就永远拿不到，红灯给的信息是残缺的。合并后
      #      两个目录都会被审到，再按「任一未通过即 exit 1」汇总 —— 覆盖只增不减。
      #
      #   ⚠️ 语义不变量（改这段前先读懂）：**真漏洞只调用 npm 1 次并立即失败，
      #      绝不重试**；只有端点故障才退避重试。已用 mock registry 复现 CI 的
      #      失败链（bulk 503 → quick 400）验过四条路径，并做过「判定恒真」的
      #      变异测试：变异后真漏洞会被重试 3 次，测试必须变红。
      - name: 'npm audit · 生产依赖（阻断：前端 + E2E）'
        # 合并成一个 step 的理由与语义不变量见上方注释块；此处只留实现。
        # ⚠️ 判定串只允许出现在 is_audit_endpoint_failure() 里一处，别在别处再抄字面量。
        run: |
          is_audit_endpoint_failure() {
            case "$1" in
              *"audits/quick"* | *"audit endpoint returned an error"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          audit_blocking() {
            local dir="$1" attempt out rc
            echo "── npm audit（生产依赖，阻断）: $dir"
            if [ ! -d "$dir" ]; then
              echo "::error::$dir：目录不存在"
              return 1
            fi
            ( cd "$dir" && npm --version )
            for attempt in 1 2 3; do
              set +e
              out=$(cd "$dir" && npm audit --package-lock-only --omit=dev --audit-level=high 2>&1)
              rc=$?
              set -e
              printf '%s\n' "$out"
              if [ "$rc" -eq 0 ]; then
                echo "✓ $dir：无 high 及以上漏洞"
                return 0
              fi
              if ! is_audit_endpoint_failure "$out"; then
                echo "::error::$dir：npm audit 失败，但不是审计端点故障（多半是**真漏洞**）—— 不重试，按阻断处理"
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::$dir：npm 审计端点故障（第 $attempt / 3 次），退避后重试"
                sleep $((attempt * 10))
              fi
            done
            echo "::error::$dir：npm 审计端点连续 3 次故障 —— 本次未能完成审计，按阻断处理（这是基础设施故障，不是依赖漏洞）"
            return 1
          }

          failed=0
          audit_blocking asd-tauri || failed=1
          audit_blocking asd-tauri/e2e || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::生产依赖审计未通过（逐目录结论见上方）"
            exit 1
          fi
      - name: 'npm audit · dev 依赖（仅报告，不阻断）'
        continue-on-error: true
        run: |
          echo "=========== asd-tauri（含 dev）==========="
          (cd asd-tauri && npm audit --package-lock-only || true)
          echo "=========== e2e（含 dev）==========="
          (cd asd-tauri/e2e && npm audit --package-lock-only || true)
          echo "以上 dev 依赖漏洞不阻断构建，但应随 TD-020 收敛。"

      # ---- cargo ----
      # ⚠️ `working-directory` 必须显式给：该 action 默认 `.`，会以 `--file ./Cargo.lock`
      # 去找锁文件，而本仓库的 Rust workspace 根是 `asd-tauri/`（仓库根没有 Cargo.lock）。
      # 缺失时的症状极具误导性 —— 报的是
      #   error: not found: Couldn't load ./Cargo.lock
      #   ##[error]Unexpected end of JSON input      ← 下游 JSON 解析失败，看起来像工具崩了
      # 而不是「路径写错了」。2026-09-16 CI 首轮真实触发即踩中（run 35059875838）。
      - name: 'cargo audit · Rust 依赖（阻断）'
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: asd-tauri

  miri:
    name: Miri UB Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly + miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo +nightly miri --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - name: Miri on 纯逻辑 crate
        working-directory: asd-tauri
        run: |
          cargo +nightly miri test -p asd-domain
          cargo +nightly miri test -p asd-ipc-protocol

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly
          rustup override set nightly
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri/src-tauri
      - name: 运行 fuzz target
        working-directory: asd-tauri/src-tauri/fuzz
        run: |
          cargo +nightly fuzz run fuzz_config_deserialize -- -max_total_time=600
          cargo +nightly fuzz run fuzz_ipc_message_parse -- -max_total_time=600
          cargo +nightly fuzz run fuzz_hotkey_merger -- -max_total_time=600
      - name: 上传 fuzz 产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: asd-tauri/src-tauri/fuzz/artifacts/
          retention-days: 30

  bench:
    name: Benchmark Regression
    # bench 位于 src-tauri（依赖 tauri / windows 系列 crate），Linux 上需要
    # glib / GTK 系统库才能构建，故与四闸门一样跑在 windows-latest。
    runs-on: windows-latest
    continue-on-error: true
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      # 与 gates job 同样的两个前置：src-tauri 的 build.rs 需要
      # ahk_executor/AutoHotkey64.exe（被 .gitignore 的 `*.exe` 排除，全新 clone 没有），
      # 缺了会直接 `failed to run custom build command`。cargo bench 同样会构建它。
      - name: 安装 AutoHotkey v2
        id: ahk
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          }

      - name: 运行基准测试
        working-directory: asd-tauri/src-tauri
        # 必须限定 --bench benchmarks：cargo bench 默认还会跑 lib / bin 目标的
        # libtest bench，`--save-baseline` 是 criterion 专属参数，传给 libtest 会
        # 直接报 `Unrecognized option: 'save-baseline'`。
        run: cargo bench --bench benchmarks -- --save-baseline current

  # ---------------------------------------------------------------- T11
  ahk-bench:
    name: AHK Benchmark Regression（T11 门禁）
    # 与上面 Rust bench 分成两个 job：Rust bench 是「观测信号」（continue-on-error），
    # 本 job 是**门禁** —— 失败会阻断合并，用于防止 T1/T6 的性能收益被后续改动吃掉。
    #
    # ⚠️ 判据：每个 metric 跑 N 轮、取 p50 的中位数，超过基线 ×K 才失败
    #   （K 见 tools/ahk-bench/baselines.json，默认 2.0）。**只设上界** —— 变快不会失败。
    #   托管 runner 硬件代际不同可能让绝对值整体偏移；若出现随机红，先本地复跑确认，
    #   确属硬件差异再 --update-baseline 重设基线并在 PR 里说明。
    runs-on: windows-latest
    # 正常路径：push 到 main。重设基线路径：手动 dispatch 勾选 update_ahk_bench_baseline。
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.update_ahk_bench_baseline)
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 与 gates / bench 两个 job 同一套安装方式（文件内第三处重复）。
      # ⚠️ 该 action 没有 `v2` 浮动标签，只能用 v2.1.0 这类具体标签。
      - name: 安装 AutoHotkey v2
        id: ahk
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 运行 AHK 生产基准门禁
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
          UPDATE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_ahk_bench_baseline }}
        run: |
          # gate.py 内部靠 .done 哨兵轮询（AHK 是 GUI 子系统，退出码不可靠）
          if (-not (Test-Path $env:AHK_EXE)) { throw "AHK_EXE 不存在: $env:AHK_EXE" }
          # ⚠️ 必须把 Python 的临时目录钉到 runner.temp：gate.py 用 tempfile.gettempdir()
          # 放 CSV，而下面上传 artifact 用的是 runner.temp —— 两者默认不是同一个目录
          # （Python 走用户 profile 下的 Temp），不统一会「No files were found」。
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          # 两个基准各守一处已落地的优化：prod_escape = T1（JSON 转义快路径），
          # prod_tick = T6（周期 tick 遍历合并）。逐个跑完再统一判定，
          # 否则第一个失败会让第二个根本不跑（静默失去一处防护）。
          $benches = @('prod_escape', 'prod_tick')
          $failed = @()
          foreach ($b in $benches) {
            Write-Host "=== bench=$b ==="
            if ($env:UPDATE_BASELINE -eq 'true') {
              # 重设基线：跑满 5 轮并把结果写回 baselines.json，随后作为 artifact 上传。
              # 不自动提交 —— 基线是门禁的锚点，必须人工确认后再进仓库。
              # ⚠️ gate.py 只覆盖 --bench 指定的那一节，顺序跑两个不会互相覆盖。
              python tools/ahk-bench/gate.py --bench $b --rounds 5 --update-baseline
            } else {
              python tools/ahk-bench/gate.py --bench $b --rounds 3
            }
            if ($LASTEXITCODE -ne 0) { $failed += $b }
          }
          if ($failed.Count -gt 0) { throw "基准门禁失败: $($failed -join ', ')" }

      - name: 上传基准 CSV（失败时便于人工复核）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahk-bench-csv
          path: |
            ${{ runner.temp }}/ahkgate-prod_escape/
            ${{ runner.temp }}/ahkgate-prod_tick/
          retention-days: 14
          if-no-files-found: warn

      - name: 上传新基线（仅重设基线时）
        if: github.event_name == 'workflow_dispatch' && inputs.update_ahk_bench_baseline
        uses: actions/upload-artifact@v4
        with:
          name: ahk-bench-baseline
          path: tools/ahk-bench/baselines.json
          retention-days: 30
          if-no-files-found: error

  e2e:
    name: E2E（仅手动触发）
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            asd-tauri/package-lock.json
            asd-tauri/e2e/package-lock.json
      - name: 安装前端依赖
        working-directory: asd-tauri
        run: npm ci

      # ⚠️ 必须单独在 e2e 目录再装一次：E2E 的依赖（@wdio/cli 等）在
      #    asd-tauri/e2e/package.json 里，**不在** asd-tauri/package.json 里。
      #    2026-09-18 run 35309066359 实测：只装 asd-tauri 时 e2e 目录下没有本地
      #    wdio 二进制，npx 于是从 registry 拉了**已废弃的 wdio@6.0.1**（2019 年的包，
      #    与 @wdio/cli 无关），它启动的是交互式 config 向导，CI 无 TTY
      #    → ExitPromptError → exit 1，**一条用例都没执行**。
      - name: 安装 E2E 依赖
        working-directory: asd-tauri/e2e
        run: npm ci

      # ⚠️ 与 gates job 同款前置，本 job 此前**缺这一步** —— 缺了它下面的
      #    `npm run tauri build` 必红：src-tauri 的 build.rs 需要
      #    ahk_executor/AutoHotkey64.exe（被 .gitignore 的 `*.exe` 排除，全新 clone
      #    里不存在），报错 `resource path ahk_executor\AutoHotkey64.exe doesn't exist`。
      #    也就是说：只修下载源而不补这一步，E2E 仍然一次都跑不起来。
      - name: 安装 AutoHotkey v2
        id: ahk
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          } else {
            Write-Host "AHK 运行时已存在，跳过: $dst"
          }

      # ⚠️ tauri-driver **没有官方预编译产物**（2026-09-18 实测：crates.io 显示其仓库为
      #    tauri-apps/tauri，该仓库 Release 资产里 0 处 driver；独立仓库
      #    tauri-apps/tauri-driver 返回 404；taiki-e/install-action 的支持清单里也没有）。
      #    所以**不能**写成二进制下载，只能源码编译 —— 用缓存把「每次编译」变成「只编译一次」。
      - name: 缓存 tauri-driver 二进制
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-2.0.6

      - name: 安装 tauri-driver（源码编译，仅缓存未命中时）
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: 探测 Edge 版本并下载匹配的 msedgedriver
        shell: pwsh
        run: |
          $edge = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe' -ErrorAction SilentlyContinue).'(default)'
          if (-not $edge -or -not (Test-Path $edge)) { $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
          if (-not (Test-Path $edge)) { throw "未找到 msedge.exe，无法探测 Edge 版本" }
          $version = (Get-Item $edge).VersionInfo.ProductVersion
          $major = $version.Split('.')[0]
          Write-Host "Edge 版本: $version（major=$major）"

          # ⚠️ 旧下载域 msedgedriver.azureedge.net 已被微软停用（实测连接失败，code=000），
          #    现行域为 msedgedriver.microsoft.com。
          # ⚠️ 该域**只接受完整四段版本号** —— 实测只给 major 一律 404
          #    （https://msedgedriver.microsoft.com/139/edgedriver_win64.zip → 404），
          #    所以不能直接拿 $major 拼 URL，那是当前代码第二个致命错误。
          # ⚠️ LATEST_RELEASE_<major> 返回的是 **UTF-16LE + BOM**，且 Content-Type 为
          #    application/octet-stream（无 charset），直接取 .Content 会被按单字节编码
          #    解码成乱码 —— 必须按字节读取再用 Unicode 解码。
          $full = ''
          try {
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/LATEST_RELEASE_$major" -OutFile "$env:RUNNER_TEMP\msedge-latest.txt"
            $bytes = [System.IO.File]::ReadAllBytes("$env:RUNNER_TEMP\msedge-latest.txt")
            $full = ([System.Text.Encoding]::Unicode.GetString($bytes) -replace '[^\d.]', '').Trim()
          } catch {
            Write-Host "LATEST_RELEASE_$major 获取失败：$($_.Exception.Message)"
          }
          if ($full -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            $full = $version
            Write-Host "回落到 Edge 自身完整版本: $full"
          }
          Write-Host "msedgedriver 版本: $full"

          Invoke-WebRequest "https://msedgedriver.microsoft.com/$full/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          # ⚠️ 光放进 PATH **不够**：wdio.conf.js:42-43 把路径写死成
          #    asd-tauri/e2e/drivers/msedgedriver.exe，并通过 --native-driver 以
          #    **绝对路径**传给 tauri-driver（:364-372）。只加 PATH 不生效 ——
          #    run 35310528367 实测：诊断日志 [FAIL] msedgedriver.exe 不存在，
          #    tauri-driver 启动即退出，9 个 worker 全部 ECONNREFUSED。
          $driversDir = Join-Path 'asd-tauri' 'e2e' 'drivers'
          New-Item -ItemType Directory -Path $driversDir -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" $driversDir -Force
          Write-Host "已放置 msedgedriver.exe -> $driversDir"
          "$env:RUNNER_TEMP\edgedriver" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 构建 Tauri 应用（debug）
        working-directory: asd-tauri
        # ⚠️ **默认不带 `--config`** —— `e2e_build_config` 默认空，构建走正式
        #    `tauri.conf.json`。这是**安全整改**：非空会让产物带 `--remote-debugging-port`，
        #    而 E2E 现在必红、并不依赖它，纯风险零收益。
        #
        # `--config` 只在 `e2e_build_config` 非空时附加（方案 1 的载体，详见
        # `asd-tauri/src-tauri/tauri.e2e.conf.README.md`）：
        #   它给主窗口加 `additionalBrowserArgs =
        #   "--remote-debugging-port=9333 --disable-features=..."`，
        #   经 tauri-runtime-wry:5054-5055 → wry::with_additional_browser_args
        #   **直接**设进 WebView2 的 AdditionalBrowserArguments。
        #   ⚠️ **方案 1 已证伪（run 35354358075）**：真实 UDF 有 EBWebView 但仍无
        #      DevToolsActivePort，错误串 `session not created: DevToolsActivePort
        #      file doesn't exist`。与 run 35350670139（webviewOptions 通道）**同结果**，
        #      两条机制独立的通道全部失败 ⇒ 候选已穷尽，见 TD-061。
        #   ⚠️ `--config` 合并语义已实测（2026-09-18 本地 rc=0）：**深合并**不是整体替换，
        #      判据是产物仍带正式配置的 productName 与 bundle/nsis（delta 里没有这些字段）。
        #      路径相对 working-directory（asd-tauri）。
        #   ⚠️ 端口固定 9333 而非 0：`=0` 时 WebView2 自选端口但**不写**
        #      DevToolsActivePort，EdgeDriver 无从得知端口。（固定端口不能靠
        #      `ms:edgeOptions.debuggerAddress` 注入 —— tauri-driver 用
        #      always_match.extend(native) 整体替换 ms:edgeOptions，server.rs:150-152。）
        #   ⚠️ 安全红线：`--remote-debugging-port` 只能出现在 E2E 专用配置里，
        #      正式 `tauri.conf.json` 出现即 C12 硬失败（scripts/check-tech-debt.py）。
        env:
          E2E_BUILD_CONFIG: ${{ inputs.e2e_build_config }}
        # ⚠️ 保持 `npm run tauri build -- ...`：改写成裸 `npx tauri build` 会绕过
        #    package.json 里的 CLI 调用链，本机实测过的那条路径就作废了。
        run: |
          if ($env:E2E_BUILD_CONFIG) {
            Write-Host "使用 E2E 专用配置构建: $env:E2E_BUILD_CONFIG"
            npm run tauri build -- --debug --config $env:E2E_BUILD_CONFIG
          } else {
            Write-Host "使用正式 tauri.conf.json 构建（默认）"
            npm run tauri build -- --debug
          }
      - name: 运行 E2E
        working-directory: asd-tauri/e2e
        # ⚠️ 必须 --no-install：裸 `npx wdio` 在本地找不到二进制时**会静默去 registry
        #    拉一个同名的废弃包**（实测拉到 wdio@6.0.1），把「依赖没装」伪装成
        #    「E2E 跑不通」，排查成本从 5 分钟变成一次 20 分钟的 CI 往返。
        #    加了 --no-install 后缺依赖会当场硬失败并写清原因。
        # ⚠️ --spec 做成可传参而非写死：诊断轮用 e2e_spec=specs/smoke.spec.js
        #    只跑 1 个 spec（connectionRetryCount 已是 0，约 1 分钟出结论），
        #    避免为一次探测付 9 分钟。留空即跑全量，行为与改动前完全一致。
        shell: pwsh
        env:
          E2E_SPEC: ${{ inputs.e2e_spec }}
          E2E_TIMEOUT_MS: ${{ inputs.e2e_timeout_ms }}
        run: |
          if ($env:E2E_SPEC) {
            Write-Host "E2E 仅运行 spec: $env:E2E_SPEC"
            npx --no-install wdio run ./wdio.conf.js --spec $env:E2E_SPEC
          } else {
            Write-Host "E2E 运行全量 spec"
            npx --no-install wdio run ./wdio.conf.js
          }
      - name: 上传 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: asd-tauri/e2e/reports
          if-no-files-found: warn

  # ============================================================ 发布（TD-074）
  # 本 job 是**唯一产出可交付安装包**的 job —— 其余 9 个 job 全是校验类，
  # 事故响应流程里的「回滚」在物理上没有产物可退（TD-074，P0）。
  #
  # 触发：**仅手动 workflow_dispatch**，且必须显式勾选 `build_release`（默认 false）。
  #   为什么不接 push / PR / tag 自动触发：
  #   ① 这条构建路径在 CI 上**从未被验证过** —— 唯一含 `tauri build` 的 e2e job
  #      被 `workflow_dispatch && inputs.run_e2e`（默认 false）挡住，结构性不可达，
  #      它里面的构建步骤一次都没执行过。「已知红的门禁比没门禁更糟」。
  #   ② 回滚并不需要 tag 触发：workflow_dispatch 支持在 UI 里**任选 ref**
  #      （分支 / tag / commit SHA），要重出某个历史版本直接选那个 ref 即可 ——
  #      这正是回滚场景需要的能力，而它天然不产生任何自动红灯。
  #   待本 job 手动跑绿一次后，再按需在 `on.push` 下加 `tags: ['v*']` 接自动发布。
  #
  # ⚠️⚠️ 跑这个 job 之前要知道的事（四条，缺一条都会让人误判）⚠️⚠️
  #
  #   [1] 产物**未做代码签名 / 未接 updater**（无证书、无密钥、无更新通道）。
  #       Windows SmartScreen 会对首次运行的安装包弹「未知发布者」告警，
  #       用户需手动「更多信息 → 仍要运行」。内网 / 受控分发场景可接受；
  #       对外分发前必须先补签名（EV 证书 + tauri.conf.json 的 bundle.windows.
  #       certificateThumbprint），否则告警会被当成恶意软件。
  #
  #   [2] 构建机**不需要** WebView2 —— tauri.conf.json 的
  #       bundle.windows.webviewInstallMode 是 `downloadBootstrapper`（silent），
  #       WebView2 运行时不进安装包，由安装器在**用户机器上联网下载**。
  #       ⇒ 代价转移到了终端：**离线 / 内网隔离环境装不上**。
  #       若目标环境不能联网，须改用 `offlineInstaller`（包体积 +约 130MB）
  #       或 `embedBootstrapper`。这是发布策略问题，不是 CI 问题。
  #
  #   [3] Tauri 的 NSIS bundler **首次构建会联网拉 NSIS 工具链**
  #       （缓存于 `%LOCALAPPDATA%\tauri`，后续构建命中缓存）。
  #       ⇒ 这是本 job 引入的**新增外部依赖**：网络受限或上游下载源故障时，
  #       job 会红在 bundler 而不是我们的代码上，排查时先看这一步。
  #
  #   [4] 本 job 走的是 **release 模式**（无 `--debug`），与 e2e job 那条
  #       `npm run tauri build -- --debug` **不是同一条命令**：release 有优化 / LTO，
  #       可能暴露 debug 从未暴露的问题。而 e2e 那条路径本身也从未真正执行过
  #       （见上面触发段的 ①）。⇒ **本 job 的构建路径首次执行不保证一次绿，
  #       必须人工观察首次结果**；在首次手动跑绿之前，不要把「CI 能出包」当成既有事实。
  release:
    name: 发布构建（NSIS 安装包，仅手动触发）
    runs-on: windows-latest
    # 发布产物是拿去给用户装的，必须建立在四闸门绿之上。若 gates 红，本 job 本就不该
    # 产出任何东西 —— 这正是想要的行为。只依赖 gates，不依赖其它辅助 job
    # （coverage / miri / fuzz / bench 等信号类 job 不参与判定）。
    needs: gates
    # `gh release create` 要经 API 建远端 tag 并写 Release，缺 `contents: write` 必红，
    # 且报错是**误导性的权限串** —— 本仓 TD-014 在 security-audit job 上踩过同型坑：
    # 审计其实跑完了，最后一步写回 Checks API 才报权限错，看着像「action 配置坏了」。
    permissions:
      contents: write
    # 静态组：让**任何两次发布执行不论 ref 都进同一组**。
    # `cancel-in-progress: false` 是刻意的 —— 发布上传中途被 cancel 会留下
    # 「Release 建了但资产不全」的半成品，排队比取消安全。
    # ⚠️ 未验证：workflow 级 `cancel-in-progress: true` 与 job 级 `false` 同时存在时
    #    谁生效、workflow 级取消是否会连带杀掉已声明 job 级 concurrency 的 job ——
    #    GitHub 文档未明确、未实测（Archi §3.3）。首次实跑时 push 一下 main 观察一次。
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    # 三重默认关闭：① 事件必须是手动 dispatch；② 必须勾选 build_release；
    # ③ **必须构建 main 分支，不允许选 tag**。
    # ⚠️ 第 ③ 条是硬性护栏，不是洁癖：远端存在 Release `v0.1.0`，其 tag 指向的提交
    #    远落后于当前 main（三个月、数百个提交之前）。workflow_dispatch 的 ref 下拉框
    #    里 tag 与分支是并列的，一旦选到 `v0.1.0`，构建出的会是**旧代码的 NSIS 包**，
    #    而它在产品外观上与正常发版产物**无法区分**。这类错误只能靠「不让它跑起来」
    #    来防 —— 事后看产物是看不出来的。
    if: github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: asd-tauri/package-lock.json

      # 前端产物（vite build → asd-tauri/dist）由 tauri.conf.json 的
      # build.beforeBuildCommand 自动触发，无需单独跑 npm run build。
      - name: 安装前端依赖
        working-directory: asd-tauri
        run: npm ci

      # ⚠️ 必须复用 gates / bench / e2e 三个 job 的同款前置，缺了构建必红：
      #    src-tauri 的 build.rs 需要 ahk_executor/AutoHotkey64.exe，而该文件被
      #    .gitignore 的 `*.exe` 排除，全新 clone 里不存在 —— 报错
      #    `resource path ahk_executor\AutoHotkey64.exe doesn't exist`。
      #    本地不明显是因为 build.rs 有缓存指纹、不会重跑。
      - name: 安装 AutoHotkey v2
        id: ahk
        # 该 action 没有 `v2` 浮动标签，只能写 v2.1.0 这类具体标签。
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          } else {
            Write-Host "AHK 运行时已存在，跳过: $dst"
          }

      # 正式配置（不带 --debug、不带 --config）：bundle.targets 已是 ['nsis']，
      # 无需再传 --bundles。产物落在
      # asd-tauri/src-tauri/target/release/bundle/nsis/ 下。
      - name: 构建 NSIS 安装包
        working-directory: asd-tauri
        run: npm run tauri build

      # 校验和与产物名必须**从磁盘实际产物推导**，不硬编码文件名 ——
      # productName 是「ASD - 技能管理器」（含空格与中文），NSIS 产物名由它
      # 拼出，硬编码会在改名时静默失效（上传一个不存在的路径 = 空 artifact）。
      - name: 收集产物并生成 SHA256
        id: meta
        shell: pwsh
        run: |
          $conf = Get-Content 'asd-tauri/src-tauri/tauri.conf.json' -Raw -Encoding utf8 | ConvertFrom-Json
          $version = [string]$conf.version
          Write-Host "版本: $version"

          $bundleDir = Join-Path 'asd-tauri' 'src-tauri' 'target' 'release' 'bundle' 'nsis'
          $installers = @(Get-ChildItem -Path $bundleDir -Filter *.exe -ErrorAction SilentlyContinue)
          # 构建返回 0 但没产出安装包，是本 job 最危险的静默失败（上传空 artifact
          # 后「有产物」的假象会一直骗到真正需要回滚的那天）。这里硬失败。
          if ($installers.Count -eq 0) {
            throw "未在 $bundleDir 找到任何安装包 —— 构建未产出 NSIS 产物"
          }

          $outDir = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $lines = @()
          foreach ($f in $installers) {
            Copy-Item $f.FullName $outDir -Force
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($f.Name)"
            Write-Host "SHA256 $hash  $($f.Name)"
          }
          # ⚠️ 显式写**不带 BOM** 的 UTF-8：Windows PowerShell 的
          # `Out-File -Encoding utf8` 会写 BOM，行首 BOM 会让
          # `sha256sum -c` / `certutil -hashfile` 一类校验工具读不出第一行。
          $sumFile = Join-Path $outDir 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllLines($sumFile, [string[]]$lines, (New-Object System.Text.UTF8Encoding($false)))

          # 汇总进 job 摘要，便于人工核对「这次发布的到底是哪个版本、哪个哈希」
          $summary = @(
            '### 发布构建产物（未签名）',
            '',
            "- 版本: ``$version``",
            '- 平台: Windows x64 / NSIS（installMode=currentUser）',
            '- ⚠️ 未签名：首次运行会有 SmartScreen「未知发布者」告警',
            '',
            '| 文件 | SHA256 |',
            '| --- | --- |'
          )
          foreach ($line in $lines) {
            $parts = $line -split '  ', 2
            $summary += "| $($parts[1]) | $($parts[0]) |"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n") -Encoding utf8

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ---------------------------------------------------------------- 冒烟
      # Archi §2 定的顺序：构建 → SHA256 → **冒烟** → 上传 artifact → 发 Release。
      # 插在这里而不是上传之后：上传是唯一兜底动作（artifact 保 90 天），冒烟若排在
      # 其后失败，artifact 已落袋，回滚素材不受影响；反过来则「冒烟红 ⇒ 连包都没有」。
      #
      # ⚠️ 这是**硬失败**，刻意不加 continue-on-error：一个永远绿的冒烟等于没有冒烟。
      #    本仓已抓到过同型假守卫（CI 里 `cargo test -- --ignored` 在零条 `#[ignore]`
      #    时恒绿）。判据全部取自「应用日志文件 + 进程表」两类磁盘/系统证据，
      #    不做 GUI 截图、不做像素判断；拿不到的判据如实报 UNVERIFIED，不静默变绿。
      #    脚本自身另带 `-SelfCheck` 双向对照（坏输入必红 / 好输入必绿），本 step 先跑它。
      #
      # ⚠️ 首次人工观察前，**不要把「CI 能出包」当既有事实**：本 job 的 release 构建
      #    路径从未在 CI 上真正跑通过（唯一含 `tauri build` 的 e2e job 被
      #    `workflow_dispatch && inputs.run_e2e`（默认 false）结构性挡住）。这个 step
      #    首次执行很可能红，而它红恰恰是有价值的信息 —— 「装上了但起不来」必须在
      #    发布之前暴露，而不是等用户装上才发现。
      #    ⇒ 首次手动跑这个 job 时，请把本 step 的输出当**首次观测数据**读，
      #      不要拿它去反推「构建没问题」。
      # ⚠️ 本 step 存在的唯一理由：**MR4（文本级接线断言）补不上的那一块**。
      #    MR4 只能抓住「重构时忘了重接」，抓不住「按新写法重接」—— 后者的失效链条是：
      #    MR4 报红 → 改一行正则去匹配新写法 → 绿 → CI 绿 → 合入，**那次红没有任何人看到**。
      #    （我原先写「误报会逼人看一眼，漏报不会」—— 在合入门禁的语义下这句是错的。）
      #    ⇒ 只有**真的跑一次 C1 失败**并断言输出里确有 `SMOKE_RESIDUE`，才能证明
      #      「主流程真的会打印」，而不是从文本匹配里推断它会打印。
      #    做法：拿一个**不会真的安装**的可执行文件当假安装器 ⇒ C1 必 FAIL ⇒ 脚本必须
      #    打印残留提示并以 exit 1 终止。
      #    ⚠️ **不依赖它的退出码**：C1 有**两条** FAIL 分支（退出码非 0 / 退出 0 但主 exe
      #    不存在）。whoami 吃到不认识的参数后返回什么都不重要 —— 主 exe 一定不会出现，
      #    C1 两条分支必居其一。换成任何「不会真的安装」的可执行文件都行。
      #    选 `whoami.exe` 只是因为它在 windows-latest 上必然存在、立即返回、无需夹具。
      #    放在**真实冒烟之前**：真实冒烟首次执行很可能红，放后面就永远轮不到它跑。
      - name: 端到端：C1 失败必须打印残留告警（不是靠文本断言推断）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = 'C:\Windows\System32\whoami.exe'
          if (-not (Test-Path -LiteralPath $fake)) {
            throw "假安装器不存在：$fake —— 换一个「不会真的安装」的可执行文件"
          }
          # ⚠️ 用 Start-Process + 重定向到**文件**，而不是 `2>&1 | Out-String`：
          #    子进程的 Write-Host 走 Information 流，**能否被父进程管道捕获**取决于宿主，
          #    本机没有 pwsh、无法验证 ⇒ 不赌它。重定向到文件是确定的，读回来即可。
          $outFile = Join-Path ([System.IO.Path]::GetTempPath()) 'smoke-e2e-out.txt'
          $errFile = Join-Path ([System.IO.Path]::GetTempPath()) 'smoke-e2e-err.txt'
          Remove-Item $outFile, $errFile -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath 'pwsh' `
            -ArgumentList @('-NoProfile', '-File', 'scripts/smoke-release-install.ps1', '-InstallerPath', $fake) `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile -Wait -PassThru -NoNewWindow
          $rc  = $proc.ExitCode
          $out = if (Test-Path -LiteralPath $outFile) { Get-Content -LiteralPath $outFile -Raw } else { '' }
          if (Test-Path -LiteralPath $errFile) {
            $errTxt = Get-Content -LiteralPath $errFile -Raw
            if ($errTxt) { Write-Host '--- stderr ---'; Write-Host $errTxt }
          }
          Write-Host '--- stdout ---'
          Write-Host $out
          # ⚠️ 退出码与输出**两条都要断言**：只看退出码会漏掉「exit 1 但没打印提示」
          #    （装失败却不留痕，正是本 step 要守的缺陷）；只看输出会漏掉终止路径坏了。
          if ($rc -ne 1) {
            throw "C1 失败时应 exit 1，实际 $rc —— 终止路径坏了（或脚本改了退出码约定）"
          }
          if (-not $out -or $out -notmatch 'SMOKE_RESIDUE:') {
            throw 'C1 失败却没有打印 SMOKE_RESIDUE —— 静默残留缺陷复发；AST 级接线断言只能证明「代码里有这个调用」，证明不了「真的会执行到」，本 step 就是为它存在的'
          }
          Write-Host '✓ 端到端确认：C1 失败会真的打印 SMOKE_RESIDUE'

      - name: 发布产物冒烟（静默安装 → 启动 → AHK 子进程 → IPC 认证）
        shell: pwsh
        run: |
          $artDir = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          $installers = @(Get-ChildItem -Path $artDir -Filter *.exe -File -ErrorAction SilentlyContinue)
          # 不静默取第一个：产物不止一个说明构建/收集环节出了问题，此时「猜一个跑」
          # 等于把「装错了包」伪装成「冒烟通过」。
          if ($installers.Count -eq 0) { throw "release-artifacts 下没有安装包: $artDir" }
          if ($installers.Count -gt 1) {
            throw "release-artifacts 下有 $($installers.Count) 个安装包，无法判定该冒烟哪一个: $($installers.Name -join ', ')"
          }
          $installer = $installers[0].FullName
          Write-Host "冒烟目标: $installer"

          # ① 先跑守卫自检（不安装任何东西）：喂坏输入必须变红、喂好输入必须变绿。
          #    ⚠️ 覆盖范围**有限**，别过度解读。且这段描述**已过期两次**，现状重写：
          #    原写「只对照 3 个辅助函数、不覆盖 C1–C5 判据组装」（那是 2026-09-19
          #    的状态，当时实测把 `if ($c5.Found)` 改成 `if ($true)` 自检仍 exit 0）。
          #    现在涵盖：辅助函数层 N1–N5/P1–P3、判据组装层 C1–C5（含 C1 的 AHK 资源
          #    **隔离**变异 MC1r）、格式化层 MR1/MR2、决策层 MR3、接线层 MR4、汇总层 MD1–MD4。
          #    **已知仍覆盖不到的三块**：① 判据谓词的**语义** —— 只能证明「故意破坏会红」，
          #    证明不了「它判的东西是对的」；② **主流程是否真的打印** —— 由前一个 step
          #    端到端守；③ C1–C5 的运行时路径只在本机跑过 2 次，且用的是 09-18 旧包。
          #    退出码 2 = 存在假守卫（不会失败的检查），直接让本 step 红。
          pwsh -NoProfile -File scripts/smoke-release-install.ps1 -SelfCheck
          if ($LASTEXITCODE -eq 2) {
            throw "冒烟脚本守卫自检失败（exit=2）—— 存在假守卫（不会失败的检查），先修脚本再谈发布"
          }
          elseif ($LASTEXITCODE -ne 0) {
            # ⚠️ 必须和 exit 2 **分开报**：非 2 的非零通常是**脚本自身抛错**（参数校验失败、
            #   Set-StrictMode 下引用未定义变量等），**不是**「判据是假守卫」。混成一条会
            #   把排障引向错误方向 —— 本轮真实发生过一次：某条断言引用了定义在它之后的
            #   变量，StrictMode 下直接抛出、退出码 1；若按「假守卫」处理就会去改判据，
            #   而真正的缺陷是**那行代码放错了位置**（也因此后面的断言一条都没跑到）。
            throw "冒烟脚本自身执行出错（exit=$LASTEXITCODE，非 2）—— 这**不是**「判据是假守卫」，先修脚本本身"
          }

          # ② 再实装冒烟。⚠️ 只传 -InstallerPath：InstallDir / MainExeName / AppIdentifier
          #    的默认值已按 CI 场景设好（TEMP 下无空格目录 / asd-tauri.exe / com.asd.tauri）。
          #    ⚠️ 不要传 -LogCopyDir 之类的旧参数 —— 脚本重写后已移除该参数，传了会在
          #    **参数绑定阶段**就报错，让冒烟红在「参数名写错」而不是真问题上。
          pwsh -NoProfile -File scripts/smoke-release-install.ps1 -InstallerPath $installer
          $rc = $LASTEXITCODE

          if ($rc -ne 0) {
            # 失败时把应用日志打进 job 日志：runner 是临时环境，不导出就永久丢失，
            # 而「哪条判据挂了 / 日志最后写了什么」是唯一的排障线索。
            # 日志在 app_data_dir 根下（logging.rs:28-34），**不是** app_data_dir\logs。
            $appLogDir = Join-Path $env:APPDATA 'com.asd.tauri'
            Write-Host '--- 冒烟失败：导出应用日志尾部 ---'
            if (Test-Path $appLogDir) {
              foreach ($f in (Get-ChildItem -Path $appLogDir -Filter 'asd.*.log' -File)) {
                Write-Host "### $($f.Name)"
                Get-Content -LiteralPath $f.FullName -Tail 200 -Encoding utf8
              }
            } else {
              Write-Host "（无日志可导出：$appLogDir 不存在 —— 失败发生在应用写日志之前）"
            }
          }
          exit $rc

      # 命名带版本号，便于事后回滚时按版本取用。
      # retention-days 90：发布产物需要覆盖回滚窗口，不能按普通 CI 产物 30 天清理。
      # ⚠️ `if: always()` 是刻意的，不要删：冒烟排在**本步之前**且是硬失败，
      #   而这个 job 从未真正跑通过 ⇒ **首次执行几乎必红**。若不加它，冒烟一红就
      #   连 artifact 都不上传 —— 而 artifact 恰恰是两件事的唯一载体：
      #   ① 事后排查「冒烟为什么红」的取证材料；② 90 天回滚兜底。
      #   （代价：即便冒烟红，产物也已存档 —— 这正是想要的。Release 仍不会发，
      #    因为发版步骤在其后，job 已失败不会走到。）
      - name: 上传安装包 + 校验和
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASD-SkillManager-v${{ steps.meta.outputs.version }}-windows-x64
          path: ${{ runner.temp }}/release-artifacts/*
          retention-days: 90
          # 这里**不能**用 warn：本 job 的唯一目的就是产出安装包，
          # 找不到文件必须是硬失败，否则「跑绿了但没有包」会被当成发布成功。
          if-no-files-found: error

      # 放在**最后一个**，顺序是：构建 → SHA256 → 冒烟 → 上传 artifact → 发 Release。
      # 两条理由：① artifact 是唯一兜底（保留 90 天）。若发布排在上传之前，发布一失败
      #   job 就中止 ⇒ 连 artifact 都没有；排在其后则「发布失败但产物已存档」，严格更优。
      #   ② 发布是 job 内唯一从未跑过的步骤，未验证的步骤应最后跑，把已确定的先落袋。
      - name: 发布 GitHub Release（需勾选 publish_release）
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha   = '${{ github.sha }}'
          $short = $sha.Substring(0, 7)

          # 1) tag：留空自动生成；只认两种形态，其它一律拒（防手滑填分支名 / 旧 tag）
          $tag = $env:REQUESTED_TAG.Trim()
          if ($tag -eq '') {
            $tag = "build-{0}-{1}" -f (Get-Date).ToUniversalTime().ToString('yyyyMMdd'), $short
            Write-Host "自动生成 tag: $tag"
          }
          if ($tag -notmatch '^build-\d{8}-[0-9a-f]{7,40}$' -and $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release_tag 非法: '$tag'（允许 build-<YYYYMMDD>-<sha7> 或 v<X.Y.Z>）"
          }
          if ($tag -eq 'v0.1.0') { throw '禁止发布到 v0.1.0（指向 2026-06-28 旧提交）' }

          # 2) 幂等闸门：已存在即硬失败，绝不覆盖
          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release '$tag' 已存在 —— 拒绝覆盖" }

          # 3) 自撰说明（不用 --generate-notes：上一 Release 是 v0.1.0 / 2026-06-28，
          #    它会吐出数百条提交；且需写清未签名 / 需联网 / 版本号不可信三件事）
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $sum = Get-Content (Join-Path $env:RUNNER_TEMP 'release-artifacts' 'SHA256SUMS.txt') -Raw -Encoding utf8
          @(
            "## ASD 技能管理器 — $tag", ''
            "- commit: ``$sha``（**溯源以此为准**；tauri.conf.json 版本长期停在 0.1.0，见 TD-078）"
            '- 平台: Windows x64 / NSIS（installMode=currentUser）'
            '- ⚠️ 未签名：SmartScreen「未知发布者」告警，需手动「更多信息 → 仍要运行」'
            '- ⚠️ 首次安装需联网下载 WebView2；离线/内网装不上'
            '- ℹ️ 历史 Release v0.1.0 无资产且指向 2026-06-28 旧提交，可用版本自本条起'
            '', '### SHA256', '```', $sum.TrimEnd(), '```'
          ) | Set-Content -Path $notes -Encoding utf8

          # 4) 建 Release。--target 保证标定源码 == 本次构建 commit。
          #    ⚠️ 刻意不加 --verify-tag：它要求 tag 事先存在，而本步正是靠 --target 新建，
          #    加了自相矛盾（该行为按 CLI 语义推断，**未实证**）。
          $files = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'release-artifacts') -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'release-artifacts 为空，拒绝创建空 Release' }
          gh release create $tag --repo '${{ github.repository }}' --target $sha `
            --title "ASD 技能管理器 $tag" --notes-file $notes $files
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败（exit=$LASTEXITCODE）" }
          "已发布: https://github.com/${{ github.repository }}/releases/tag/$tag" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
