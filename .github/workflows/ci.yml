name: CI

# DoD 四闸门（gates job，windows-latest，任一红即失败）：
#   G1 图谱基线（无新增环 / 无白名单外依赖违规）
#   G2 cargo fmt + clippy 零告警
#   G3 测试通过且已登记（cargo / AHK / JS + test-map.md 数字对账）
#   G4 文档同步（人工核对，CI 只输出清单）
# 本地等价入口：scripts/check-gates.ps1 或 scripts/check-gates.sh
#
# 其余 job（coverage / miri / fuzz / bench）为辅助质量信号，均 continue-on-error，
# 不阻塞合并。⚠️ 例外：**ahk-bench 是门禁，不是信号** —— 它跑 AHK 生产基准
# （tools/ahk-bench/gate.py），超过基线 ×K 即失败并阻断合并，用于守住 T1/T6 的收益。
# 平台选择（踩过坑，勿随意改）：
#   - miri / fuzz：依赖 nightly 且 Windows 支持不佳 → ubuntu
#   - coverage：只覆盖纯逻辑 crate（Linux 可编译）→ ubuntu
#   - bench：位于 src-tauri，Linux 需 glib/GTK 系统库才能构建 → windows-latest
#
# 历史说明：本文件曾位于 asd-tauri/.github/workflows/ci.yml。GitHub Actions 只读取
# **仓库根目录**的 .github/workflows，子目录那份从未被执行过，已迁移至此并修复
# working-directory 缺失、cargo fmt --all -- --check 写法错误等问题。

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # 每周日 0 点 UTC，仅触发 fuzz job
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '同时运行 E2E（需 WebView2 + tauri-driver + msedgedriver，CI 上不稳定，默认关闭）'
        type: boolean
        default: false
      update_ahk_bench_baseline:
        description: '重设 AHK 生产基准基线：在 CI 上跑满轮数并把新的 baselines.json 作为 artifact 上传（下载后人工确认再提交）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Windows runner 上 Python 的 stdio 默认用系统 ANSI 代码页（cp1252），
  # 脚本 print 中文会抛 UnicodeEncodeError，且子进程输出按 cp1252 解码会乱码。
  # 开启 UTF-8 模式后 stdio 与默认编码统一为 utf-8（Python 3.7+）。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ============================================================ 四闸门
  gates:
    name: 四闸门 (windows-latest)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JS 单测只用 node 内置模块，无需 npm ci（省去安装前端依赖的时间）

      - name: 安装 AutoHotkey v2
        id: ahk
        # 注意：该 action 只发布了 v2.1.0 / v2.0.0 等具体标签，**没有 `v2` 浮动标签**
        # （v1 才有）。写 @v2 会在 "Set up job" 阶段直接失败：unable to find version。
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          # tauri.conf.json 的 bundle.resources 声明了 ahk_executor/AutoHotkey64.exe
          # （路径相对 src-tauri）。该 exe 被 .gitignore 的 `*.exe` 排除，全新 clone
          # 里并不存在，src-tauri 的 build.rs 会直接失败：
          #   resource path `ahk_executor\AutoHotkey64.exe` doesn't exist
          # 本地之所以不明显，是因为 build.rs 有缓存指纹、不会重跑。
          # CI 上把上一步装好的 AHK 复制过去，等价于开发者本地放置该文件。
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          } else {
            Write-Host "AHK 运行时已存在，跳过: $dst"
          }

      - name: 安装版本化 git 钩子
        shell: pwsh
        run: .\scripts\install-hooks.ps1

      # ------------------------------------------------------------ G1
      - name: 'G1 图谱基线'
        run: python scripts/check-graph-baseline.py

      # ------------------------------------------------------------ G2
      - name: 'G2a cargo fmt --all --check'
        working-directory: asd-tauri
        run: cargo fmt --all --check

      - name: 'G2b cargo clippy --workspace --all-targets -- -D warnings'
        working-directory: asd-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ------------------------------------------------------------ G3
      - name: 'G3a cargo test --workspace'
        working-directory: asd-tauri
        run: cargo test --workspace

      # watchdog 进程生命周期用例带 `#[ignore]`（G3a 默认跳过），覆盖
      # start_child_process / crash_restart / restart_limit / graceful_shutdown 等路径 ——
      # 这些路径一旦回归，表现是「按键静默失效」而**没有任何红灯**。
      # 原排除理由写的是「避免在 CI 中运行慢测试」，但 2026-09-18 在当前 HEAD 实测：
      # 15 passed / 0 failed / finished in 13.39s —— 理由不成立（且不算慢）。
      # 故以「观测期」接入：continue-on-error 不阻断，连续跑绿 3-5 次后再摘 `#[ignore]` 转硬门禁。
      # ⚠️ 必须带 CARGO_INCREMENTAL=0：否则 rustc 可能 ICE（退出码 101），会被误读成测试失败。
      - name: 'G3h watchdog 进程生命周期（--ignored，观测期不阻断）'
        working-directory: asd-tauri
        env:
          CARGO_INCREMENTAL: '0'
        continue-on-error: true
        run: cargo test -p asd-tauri --lib -- --ignored --test-threads=1

      - name: 'G3b AHK 完整测试套件'
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
          # 关闭「宿主时延类断言」（SenderPreciseTimingTests 里 7 条绝对墙钟时延用例）。
          # 定刻走 QPC 忙等，共享 runner 的 CPU 争用会直接把它打穿 —— 实测 CI 上
          # SleepUntil p95=11.15ms（阈值 5）、periodic 端到端 p95=31.86ms（阈值 20），
          # 且按插值其中位数也已越线，属宿主争用而非实现回归。放宽阈值测不出回归，
          # 硬判则必然 flaky，故 CI 显式跳过；跳过的条数会打进下面的汇总，不会静默消失。
          # 本机四闸门（scripts/check-gates.sh）不设此变量，7 条照跑。
          ASD_HOST_TIMING: '0'
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ahk-gate.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'ahk-gate.err.log'
          $resultLog = "tests/test_results.log"

          # AutoHotkey64.exe 是 GUI 子系统程序。用 `& $exe ...` 调用时 PowerShell
          # **不会等待**它结束，$LASTEXITCODE 也不会被设置 —— 实测表现为日志 0 字节、
          # 退出码为空。必须 Start-Process -Wait -PassThru 才能拿到真实退出码。
          $p = Start-Process -FilePath $env:AHK_EXE `
            -ArgumentList @('tests/run_all_tests.ahk') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $errLog
          $exit = $p.ExitCode

          # 显式指定 utf8：Windows runner 上 Get-Content 否则按系统 ANSI 代码页解码，
          # 中文汇总行会乱码，导致下面的正则匹配不到而误判为「无法解析」。
          # 另外不要依赖自动变量 $Matches 取值：左操作数为 $null 或数组时它不会被填充，
          # 实测会走到 "Cannot index into a null array" 而不是这里的报错分支。
          # 统一用 [regex]::Match 显式取分组；$text 先初始化为 '' 避免 $null 参与比较。
          # 汇总以 tests/test_results.log 为准（runner 自己写的），stdout 只是兜底
          $text = ''
          if (Test-Path $resultLog) { $text = [string](Get-Content $resultLog -Raw -Encoding utf8) }
          if ($text -notmatch '总计:' -and (Test-Path $log)) {
            $text = [string](Get-Content $log -Raw -Encoding utf8)
          }

          # 诊断：AHK 是否真的跑起来，先看退出码与三份日志的字节数
          Write-Host "AHK 退出码: $exit"
          Write-Host "test_results.log 字节: $((Get-Item $resultLog -ErrorAction SilentlyContinue).Length)"
          Write-Host "ahk-gate.log 字节: $((Get-Item $log -ErrorAction SilentlyContinue).Length)"
          Write-Host "ahk-gate.err.log 字节: $((Get-Item $errLog -ErrorAction SilentlyContinue).Length)"
          Write-Host "--- ahk-gate.err.log 尾部 ---"
          if (Test-Path $errLog) { Get-Content $errLog -Tail 20 -Encoding utf8 }
          Write-Host "--- ahk-gate.log 尾部 ---"
          if (Test-Path $log) { Get-Content $log -Tail 40 -Encoding utf8 }
          Write-Host "--- test_results.log 尾部 ---"
          if (Test-Path $resultLog) { Get-Content $resultLog -Tail 20 -Encoding utf8 }

          $m = [regex]::Match($text, '总计:\s*(\d+)[\s\S]*?通过:\s*(\d+)[\s\S]*?失败:\s*(\d+)')
          if (-not $m.Success) {
            throw "无法解析 AHK 结果汇总（未找到 总计/通过/失败）。AHK 退出码=$exit"
          }
          $total = [int]$m.Groups[1].Value
          $pass  = [int]$m.Groups[2].Value
          $fail  = [int]$m.Groups[3].Value
          # 跳过数可选（旧格式没有这一行）：取不到就按 0 处理，不影响主判定
          $ms = [regex]::Match($text, '跳过:\s*(\d+)')
          $skip = 0
          if ($ms.Success) { $skip = [int]$ms.Groups[1].Value }
          Write-Host "AHK 汇总: 总计 $total / 通过 $pass / 失败 $fail / 跳过 $skip"
          if ($total -eq 0) { throw 'AHK 总计为 0，测试未实际运行' }
          if ($fail -gt 0) { throw "AHK 测试失败 $fail 个" }
          # 跳过必须可见：本 job 固定关掉 7 条宿主时延断言，若一条都没跳过说明
          # 门控失效（环境变量没传进去 / 用例被改名），那才是要报的问题。
          if ($skip -eq 0) {
            throw "预期跳过 7 条宿主时延断言（ASD_HOST_TIMING=0），实际 0 条 —— 门控可能失效"
          }

      - name: 'G3c JS 单元测试'
        working-directory: asd-tauri
        shell: pwsh
        run: |
          # 不能用 `node --test <目录>`：会被 node 当成 CJS 模块去 require
          # 两处：e2e 辅助模块的测试 + 前端 src/ 的测试（TD-005 起有 src/__tests__）
          $files = @(
            Get-ChildItem -Path 'e2e/helpers/__tests__' -Filter *.test.js | ForEach-Object { $_.FullName }
            Get-ChildItem -Path 'src/__tests__'         -Filter *.test.js | ForEach-Object { $_.FullName }
          )
          if ($files.Count -eq 0) { throw '未找到任何 *.test.js' }
          node --test @files

      - name: 'G3d test-map.md 登记对账'
        run: python scripts/check-test-map.py

      # 静态检查，约 2.5s。C1a/C1b/C1c/C2/C3b 走棘轮（只阻新增），C3 恒 0 硬阻断。
      # 依赖 .review-analysis/tech-debt-baseline.json（已入库）。
      - name: 'G3e 技术债度量（C1 孤儿 / C2 未接入 / C3 文档漂移 / C3b 硬写数字）'
        run: python scripts/check-tech-debt.py

      # tests/ 下 7 个独立脚本，不在 run_all_tests.ahk 的套件注册里，历史上从未被
      # 任何 runner 执行过 —— 2026-09-16 首次接入执行就连挖三个生产 BUG（TD-034/035/036），
      # 随后 TD-037 又挖出两个。不进门禁，它们会继续腐烂。
      - name: 'G3g AHK 独立脚本（tests/test_*.ahk，逐个按退出码汇总）'
        shell: bash
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: bash scripts/run-standalone-ahk-tests.sh

      # ------------------------------------------------------------ G4
      - name: 'G4 文档同步（人工核对清单）'
        shell: pwsh
        run: |
          Write-Host '以下项目无法自动校验，请在评审时人工确认：'
          Write-Host '  [ ] AGENTS.md 架构/分层/妥协白名单是否同步'
          Write-Host '  [ ] asd-tauri/docs/test-map.md 测试数是否更新（G3d 已校验数字自洽）'
          Write-Host '  [ ] docs/developer-guide.md 命令与排障是否同步'
          Write-Host '  [ ] docs/graph-driven-workflow.md 流程是否同步'
          Write-Host '  [ ] 新增 crate / 跨 crate 依赖是否同步 ALLOWED_CRATE_DEPS'
          Write-Host '  [ ] 清理了技术债后是否 --update-baseline 收紧水位（基线 diff 须出现在本 CR）'

  # 独立 job：只需要 checkout + node + npm ci，与主 job 的 Rust 构建并行，
  # 不占用主 job 的关键路径（放主 job 里要多等一次 npm ci）。
  js-lint:
    name: 前端 lint（ESLint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'npm ci'
        working-directory: asd-tauri
        run: npm ci
      # 水位 0（TD-022 已清零，2026-09-17）：存量 69 项全清，eslint.config.js 里那三条
      # 降级覆盖也撤了 —— no-redeclare / no-empty / no-prototype-builtins 回到
      # recommended 的 error 级。现在**新增任何一处都立刻红**，不需要再靠数字棘轮兜。
      - name: 'eslint（--max-warnings 0，新增即 FAIL）'
        working-directory: asd-tauri
        run: npm run lint

  # ============================================================ 辅助（不阻塞）
  coverage:
    name: Coverage（纯逻辑 crate）
    runs-on: ubuntu-latest
    # ⚠️ TD-006 起本 job 是**阻断**的（原为 continue-on-error + 仅 push 时跑），
    #    因为「无阈值、非阻断」的覆盖率等于没有覆盖率门禁。
    #    为让它稳定到可以阻断，cargo-llvm-cov 改用预编译二进制（install-action）：
    #    `cargo install` 的编译耗时与偶发网络失败会把无关原因变成红灯，
    #    而「红灯与代码无关」正是门禁被全员忽略的最快路径。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - name: 安装 cargo-llvm-cov（预编译二进制）
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: 生成 lcov
        working-directory: asd-tauri
        # 只覆盖三个纯逻辑 crate。workspace 里的 src-tauri 依赖 windows / tauri 系列
        # crate，在 Linux 上无法编译（windows-future 报 E0425），`--workspace` 必失败；
        # 纯逻辑 crate 按分层规则不引入 tauri / tokio / interprocess / windows，可安全跑。
        run: |
          mkdir -p coverage
          cargo llvm-cov --package asd-domain --package asd-ipc-protocol --package asd-application --lcov --output-path coverage/lcov.info
      # 棘轮门禁：整体容差 0.5pp、单文件 2.0pp，只阻下降不阻上升。
      # 基线在本机（Windows）实测；若 CI（ubuntu）因 cfg 分支系统性偏离，
      # 下载本 job 的 coverage-report artifact 重跑一次 --update-baseline 校准即可。
      - name: 'G3f 覆盖率门禁（棘轮：下降即 FAIL）'
        run: python scripts/check-coverage.py --lcov asd-tauri/coverage/lcov.info
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: asd-tauri/coverage/lcov.info
          retention-days: 30

  security-audit:
    name: 依赖安全审计（TD-014）
    runs-on: ubuntu-latest
    # ⚠️ 必须显式开 checks: write。默认 GITHUB_TOKEN 没有这个权限，
    # rustsec/audit-check 在**最后一步**把结果写回 Checks API 时会报
    #   Resource not accessible by integration
    # 而**审计本身其实是跑完了的** —— 于是 job 红了、日志里却只看到一句权限错误，
    # 极容易被误读成「action 配置坏了」或者「没装成功」。2026-09-16 run 35113576002 实测。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      # ---- npm：生产依赖阻断，dev 依赖只报告 ----
      #
      # 为什么要分开：生产依赖进交付物，有 CVE 就该拦；dev 依赖不进交付物，
      # 且 `npm audit fix` 常常需要 breaking change —— 一刀切阻断的结果不是
      # 「大家去修依赖」，而是「把这个 job 关掉」。
      # 所以 dev 这边只把数字打进日志（不静默），存量漏洞单独登记排期（TD-020）。
      - name: 'npm audit · 前端生产依赖（阻断）'
        working-directory: asd-tauri
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: 'npm audit · E2E 生产依赖（阻断）'
        working-directory: asd-tauri/e2e
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: 'npm audit · dev 依赖（仅报告，不阻断）'
        continue-on-error: true
        run: |
          echo "=========== asd-tauri（含 dev）==========="
          (cd asd-tauri && npm audit --package-lock-only || true)
          echo "=========== e2e（含 dev）==========="
          (cd asd-tauri/e2e && npm audit --package-lock-only || true)
          echo "以上 dev 依赖漏洞不阻断构建，但应随 TD-020 收敛。"

      # ---- cargo ----
      # ⚠️ `working-directory` 必须显式给：该 action 默认 `.`，会以 `--file ./Cargo.lock`
      # 去找锁文件，而本仓库的 Rust workspace 根是 `asd-tauri/`（仓库根没有 Cargo.lock）。
      # 缺失时的症状极具误导性 —— 报的是
      #   error: not found: Couldn't load ./Cargo.lock
      #   ##[error]Unexpected end of JSON input      ← 下游 JSON 解析失败，看起来像工具崩了
      # 而不是「路径写错了」。2026-09-16 CI 首轮真实触发即踩中（run 35059875838）。
      - name: 'cargo audit · Rust 依赖（阻断）'
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: asd-tauri

  miri:
    name: Miri UB Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly + miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo +nightly miri --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - name: Miri on 纯逻辑 crate
        working-directory: asd-tauri
        run: |
          cargo +nightly miri test -p asd-domain
          cargo +nightly miri test -p asd-ipc-protocol

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly
          rustup override set nightly
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri/src-tauri
      - name: 运行 fuzz target
        working-directory: asd-tauri/src-tauri/fuzz
        run: |
          cargo +nightly fuzz run fuzz_config_deserialize -- -max_total_time=600
          cargo +nightly fuzz run fuzz_ipc_message_parse -- -max_total_time=600
          cargo +nightly fuzz run fuzz_hotkey_merger -- -max_total_time=600
      - name: 上传 fuzz 产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: asd-tauri/src-tauri/fuzz/artifacts/
          retention-days: 30

  bench:
    name: Benchmark Regression
    # bench 位于 src-tauri（依赖 tauri / windows 系列 crate），Linux 上需要
    # glib / GTK 系统库才能构建，故与四闸门一样跑在 windows-latest。
    runs-on: windows-latest
    continue-on-error: true
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      # 与 gates job 同样的两个前置：src-tauri 的 build.rs 需要
      # ahk_executor/AutoHotkey64.exe（被 .gitignore 的 `*.exe` 排除，全新 clone 没有），
      # 缺了会直接 `failed to run custom build command`。cargo bench 同样会构建它。
      - name: 安装 AutoHotkey v2
        id: ahk
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          }

      - name: 运行基准测试
        working-directory: asd-tauri/src-tauri
        # 必须限定 --bench benchmarks：cargo bench 默认还会跑 lib / bin 目标的
        # libtest bench，`--save-baseline` 是 criterion 专属参数，传给 libtest 会
        # 直接报 `Unrecognized option: 'save-baseline'`。
        run: cargo bench --bench benchmarks -- --save-baseline current

  # ---------------------------------------------------------------- T11
  ahk-bench:
    name: AHK Benchmark Regression（T11 门禁）
    # 与上面 Rust bench 分成两个 job：Rust bench 是「观测信号」（continue-on-error），
    # 本 job 是**门禁** —— 失败会阻断合并，用于防止 T1/T6 的性能收益被后续改动吃掉。
    #
    # ⚠️ 判据：每个 metric 跑 N 轮、取 p50 的中位数，超过基线 ×K 才失败
    #   （K 见 tools/ahk-bench/baselines.json，默认 2.0）。**只设上界** —— 变快不会失败。
    #   托管 runner 硬件代际不同可能让绝对值整体偏移；若出现随机红，先本地复跑确认，
    #   确属硬件差异再 --update-baseline 重设基线并在 PR 里说明。
    runs-on: windows-latest
    # 正常路径：push 到 main。重设基线路径：手动 dispatch 勾选 update_ahk_bench_baseline。
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.update_ahk_bench_baseline)
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 与 gates / bench 两个 job 同一套安装方式（文件内第三处重复）。
      # ⚠️ 该 action 没有 `v2` 浮动标签，只能用 v2.1.0 这类具体标签。
      - name: 安装 AutoHotkey v2
        id: ahk
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 运行 AHK 生产基准门禁
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
          UPDATE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_ahk_bench_baseline }}
        run: |
          # gate.py 内部靠 .done 哨兵轮询（AHK 是 GUI 子系统，退出码不可靠）
          if (-not (Test-Path $env:AHK_EXE)) { throw "AHK_EXE 不存在: $env:AHK_EXE" }
          # ⚠️ 必须把 Python 的临时目录钉到 runner.temp：gate.py 用 tempfile.gettempdir()
          # 放 CSV，而下面上传 artifact 用的是 runner.temp —— 两者默认不是同一个目录
          # （Python 走用户 profile 下的 Temp），不统一会「No files were found」。
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          # 两个基准各守一处已落地的优化：prod_escape = T1（JSON 转义快路径），
          # prod_tick = T6（周期 tick 遍历合并）。逐个跑完再统一判定，
          # 否则第一个失败会让第二个根本不跑（静默失去一处防护）。
          $benches = @('prod_escape', 'prod_tick')
          $failed = @()
          foreach ($b in $benches) {
            Write-Host "=== bench=$b ==="
            if ($env:UPDATE_BASELINE -eq 'true') {
              # 重设基线：跑满 5 轮并把结果写回 baselines.json，随后作为 artifact 上传。
              # 不自动提交 —— 基线是门禁的锚点，必须人工确认后再进仓库。
              # ⚠️ gate.py 只覆盖 --bench 指定的那一节，顺序跑两个不会互相覆盖。
              python tools/ahk-bench/gate.py --bench $b --rounds 5 --update-baseline
            } else {
              python tools/ahk-bench/gate.py --bench $b --rounds 3
            }
            if ($LASTEXITCODE -ne 0) { $failed += $b }
          }
          if ($failed.Count -gt 0) { throw "基准门禁失败: $($failed -join ', ')" }

      - name: 上传基准 CSV（失败时便于人工复核）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahk-bench-csv
          path: |
            ${{ runner.temp }}/ahkgate-prod_escape/
            ${{ runner.temp }}/ahkgate-prod_tick/
          retention-days: 14
          if-no-files-found: warn

      - name: 上传新基线（仅重设基线时）
        if: github.event_name == 'workflow_dispatch' && inputs.update_ahk_bench_baseline
        uses: actions/upload-artifact@v4
        with:
          name: ahk-bench-baseline
          path: tools/ahk-bench/baselines.json
          retention-days: 30
          if-no-files-found: error

  e2e:
    name: E2E（仅手动触发）
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: asd-tauri/package-lock.json
      - name: 安装前端依赖
        working-directory: asd-tauri
        run: npm ci
      - name: 安装 tauri-driver
        run: cargo install tauri-driver
      - name: 探测 Edge 版本并下载匹配的 msedgedriver
        shell: pwsh
        run: |
          $edge = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe' -ErrorAction SilentlyContinue).'(default)'
          if (-not $edge) { $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
          $version = (Get-Item $edge).VersionInfo.ProductVersion
          $major = $version.Split('.')[0]
          Write-Host "Edge 版本: $version"
          Invoke-WebRequest "https://msedgedriver.azureedge.net/$major/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          "$env:RUNNER_TEMP\edgedriver" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 构建 Tauri 应用（debug）
        working-directory: asd-tauri
        run: npm run tauri build -- --debug
      - name: 运行 E2E
        working-directory: asd-tauri/e2e
        run: npx wdio run wdio.conf.js
      - name: 上传 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: asd-tauri/e2e/reports
          if-no-files-found: warn
