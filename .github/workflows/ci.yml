name: CI

# DoD 四闸门（gates job，windows-latest，任一红即失败）：
#   G1 图谱基线（无新增环 / 无白名单外依赖违规）
#   G2 cargo fmt + clippy 零告警
#   G3 测试通过且已登记（cargo / AHK / JS + test-map.md 数字对账）
#   G4 文档同步（人工核对，CI 只输出清单）
# 本地等价入口：scripts/check-gates.ps1 或 scripts/check-gates.sh
#
# 其余 job（coverage / miri / fuzz / bench）为辅助质量信号，均 continue-on-error，
# 不阻塞合并。平台选择（踩过坑，勿随意改）：
#   - miri / fuzz：依赖 nightly 且 Windows 支持不佳 → ubuntu
#   - coverage：只覆盖纯逻辑 crate（Linux 可编译）→ ubuntu
#   - bench：位于 src-tauri，Linux 需 glib/GTK 系统库才能构建 → windows-latest
#
# 历史说明：本文件曾位于 asd-tauri/.github/workflows/ci.yml。GitHub Actions 只读取
# **仓库根目录**的 .github/workflows，子目录那份从未被执行过，已迁移至此并修复
# working-directory 缺失、cargo fmt --all -- --check 写法错误等问题。

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # 每周日 0 点 UTC，仅触发 fuzz job
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '同时运行 E2E（需 WebView2 + tauri-driver + msedgedriver，CI 上不稳定，默认关闭）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Windows runner 上 Python 的 stdio 默认用系统 ANSI 代码页（cp1252），
  # 脚本 print 中文会抛 UnicodeEncodeError，且子进程输出按 cp1252 解码会乱码。
  # 开启 UTF-8 模式后 stdio 与默认编码统一为 utf-8（Python 3.7+）。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ============================================================ 四闸门
  gates:
    name: 四闸门 (windows-latest)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JS 单测只用 node 内置模块，无需 npm ci（省去安装前端依赖的时间）

      - name: 安装 AutoHotkey v2
        id: ahk
        # 注意：该 action 只发布了 v2.1.0 / v2.0.0 等具体标签，**没有 `v2` 浮动标签**
        # （v1 才有）。写 @v2 会在 "Set up job" 阶段直接失败：unable to find version。
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          # tauri.conf.json 的 bundle.resources 声明了 ahk_executor/AutoHotkey64.exe
          # （路径相对 src-tauri）。该 exe 被 .gitignore 的 `*.exe` 排除，全新 clone
          # 里并不存在，src-tauri 的 build.rs 会直接失败：
          #   resource path `ahk_executor\AutoHotkey64.exe` doesn't exist
          # 本地之所以不明显，是因为 build.rs 有缓存指纹、不会重跑。
          # CI 上把上一步装好的 AHK 复制过去，等价于开发者本地放置该文件。
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          } else {
            Write-Host "AHK 运行时已存在，跳过: $dst"
          }

      - name: 安装版本化 git 钩子
        shell: pwsh
        run: .\scripts\install-hooks.ps1

      # ------------------------------------------------------------ G1
      - name: 'G1 图谱基线'
        run: python scripts/check-graph-baseline.py

      # ------------------------------------------------------------ G2
      - name: 'G2a cargo fmt --all --check'
        working-directory: asd-tauri
        run: cargo fmt --all --check

      - name: 'G2b cargo clippy --workspace --all-targets -- -D warnings'
        working-directory: asd-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ------------------------------------------------------------ G3
      - name: 'G3a cargo test --workspace'
        working-directory: asd-tauri
        run: cargo test --workspace

      - name: 'G3b AHK 完整测试套件'
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ahk-gate.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'ahk-gate.err.log'
          $resultLog = "tests/test_results.log"

          # AutoHotkey64.exe 是 GUI 子系统程序。用 `& $exe ...` 调用时 PowerShell
          # **不会等待**它结束，$LASTEXITCODE 也不会被设置 —— 实测表现为日志 0 字节、
          # 退出码为空。必须 Start-Process -Wait -PassThru 才能拿到真实退出码。
          $p = Start-Process -FilePath $env:AHK_EXE `
            -ArgumentList @('tests/run_all_tests.ahk') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $errLog
          $exit = $p.ExitCode

          # 显式指定 utf8：Windows runner 上 Get-Content 否则按系统 ANSI 代码页解码，
          # 中文汇总行会乱码，导致下面的正则匹配不到而误判为「无法解析」。
          # 另外不要依赖自动变量 $Matches 取值：左操作数为 $null 或数组时它不会被填充，
          # 实测会走到 "Cannot index into a null array" 而不是这里的报错分支。
          # 统一用 [regex]::Match 显式取分组；$text 先初始化为 '' 避免 $null 参与比较。
          # 汇总以 tests/test_results.log 为准（runner 自己写的），stdout 只是兜底
          $text = ''
          if (Test-Path $resultLog) { $text = [string](Get-Content $resultLog -Raw -Encoding utf8) }
          if ($text -notmatch '总计:' -and (Test-Path $log)) {
            $text = [string](Get-Content $log -Raw -Encoding utf8)
          }

          # 诊断：AHK 是否真的跑起来，先看退出码与三份日志的字节数
          Write-Host "AHK 退出码: $exit"
          Write-Host "test_results.log 字节: $((Get-Item $resultLog -ErrorAction SilentlyContinue).Length)"
          Write-Host "ahk-gate.log 字节: $((Get-Item $log -ErrorAction SilentlyContinue).Length)"
          Write-Host "ahk-gate.err.log 字节: $((Get-Item $errLog -ErrorAction SilentlyContinue).Length)"
          Write-Host "--- ahk-gate.err.log 尾部 ---"
          if (Test-Path $errLog) { Get-Content $errLog -Tail 20 -Encoding utf8 }
          Write-Host "--- ahk-gate.log 尾部 ---"
          if (Test-Path $log) { Get-Content $log -Tail 40 -Encoding utf8 }
          Write-Host "--- test_results.log 尾部 ---"
          if (Test-Path $resultLog) { Get-Content $resultLog -Tail 20 -Encoding utf8 }

          $m = [regex]::Match($text, '总计:\s*(\d+)[\s\S]*?通过:\s*(\d+)[\s\S]*?失败:\s*(\d+)')
          if (-not $m.Success) {
            throw "无法解析 AHK 结果汇总（未找到 总计/通过/失败）。AHK 退出码=$exit"
          }
          $total = [int]$m.Groups[1].Value
          $pass  = [int]$m.Groups[2].Value
          $fail  = [int]$m.Groups[3].Value
          Write-Host "AHK 汇总: 总计 $total / 通过 $pass / 失败 $fail"
          if ($total -eq 0) { throw 'AHK 总计为 0，测试未实际运行' }
          if ($fail -gt 0) { throw "AHK 测试失败 $fail 个" }

      - name: 'G3c JS 单元测试'
        working-directory: asd-tauri/e2e/helpers/__tests__
        shell: pwsh
        run: |
          # 不能用 `node --test <目录>`：会被 node 当成 CJS 模块去 require
          $files = @(Get-ChildItem -Filter *.test.js | Select-Object -ExpandProperty Name)
          if ($files.Count -eq 0) { throw '未找到任何 *.test.js' }
          node --test @files

      - name: 'G3d test-map.md 登记对账'
        run: python scripts/check-test-map.py

      # ------------------------------------------------------------ G4
      - name: 'G4 文档同步（人工核对清单）'
        shell: pwsh
        run: |
          Write-Host '以下项目无法自动校验，请在评审时人工确认：'
          Write-Host '  [ ] AGENTS.md 架构/分层/妥协白名单是否同步'
          Write-Host '  [ ] asd-tauri/docs/test-map.md 测试数是否更新（G3d 已校验数字自洽）'
          Write-Host '  [ ] docs/developer-guide.md 命令与排障是否同步'
          Write-Host '  [ ] docs/graph-driven-workflow.md 流程是否同步'
          Write-Host '  [ ] 新增 crate / 跨 crate 依赖是否同步 ALLOWED_CRATE_DEPS'

  # ============================================================ 辅助（不阻塞）
  coverage:
    name: Coverage（纯逻辑 crate）
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - name: 安装 cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: 生成 lcov
        working-directory: asd-tauri
        # 只覆盖三个纯逻辑 crate。workspace 里的 src-tauri 依赖 windows / tauri 系列
        # crate，在 Linux 上无法编译（windows-future 报 E0425），`--workspace` 必失败；
        # 纯逻辑 crate 按分层规则不引入 tauri / tokio / interprocess / windows，可安全跑。
        run: cargo llvm-cov --package asd-domain --package asd-ipc-protocol --package asd-application --lcov --output-path lcov.info
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: asd-tauri/lcov.info
          retention-days: 30

  miri:
    name: Miri UB Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly + miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo +nightly miri --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - name: Miri on 纯逻辑 crate
        working-directory: asd-tauri
        run: |
          cargo +nightly miri test -p asd-domain
          cargo +nightly miri test -p asd-ipc-protocol

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly
          rustup override set nightly
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri/src-tauri
      - name: 运行 fuzz target
        working-directory: asd-tauri/src-tauri/fuzz
        run: |
          cargo +nightly fuzz run fuzz_config_deserialize -- -max_total_time=600
          cargo +nightly fuzz run fuzz_ipc_message_parse -- -max_total_time=600
          cargo +nightly fuzz run fuzz_hotkey_merger -- -max_total_time=600
      - name: 上传 fuzz 产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: asd-tauri/src-tauri/fuzz/artifacts/
          retention-days: 30

  bench:
    name: Benchmark Regression
    # bench 位于 src-tauri（依赖 tauri / windows 系列 crate），Linux 上需要
    # glib / GTK 系统库才能构建，故与四闸门一样跑在 windows-latest。
    runs-on: windows-latest
    continue-on-error: true
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      # 与 gates job 同样的两个前置：src-tauri 的 build.rs 需要
      # ahk_executor/AutoHotkey64.exe（被 .gitignore 的 `*.exe` 排除，全新 clone 没有），
      # 缺了会直接 `failed to run custom build command`。cargo bench 同样会构建它。
      - name: 安装 AutoHotkey v2
        id: ahk
        uses: holy-tao/install-autohotkey@v2.1.0
        with:
          version: '2.0.26'
          destination: ${{ runner.temp }}

      - name: 准备 ahk_executor 的 AHK 运行时资源
        shell: pwsh
        env:
          AHK_EXE: ${{ steps.ahk.outputs.ahk64 }}
        run: |
          $dst = Join-Path 'asd-tauri' 'src-tauri' 'ahk_executor' 'AutoHotkey64.exe'
          if (-not (Test-Path $dst)) {
            Copy-Item $env:AHK_EXE $dst
            Write-Host "已放置 AHK 运行时: $dst"
          }

      - name: 运行基准测试
        working-directory: asd-tauri/src-tauri
        # 必须限定 --bench benchmarks：cargo bench 默认还会跑 lib / bin 目标的
        # libtest bench，`--save-baseline` 是 criterion 专属参数，传给 libtest 会
        # 直接报 `Unrecognized option: 'save-baseline'`。
        run: cargo bench --bench benchmarks -- --save-baseline current

  e2e:
    name: E2E（仅手动触发）
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asd-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: asd-tauri/package-lock.json
      - name: 安装前端依赖
        working-directory: asd-tauri
        run: npm ci
      - name: 安装 tauri-driver
        run: cargo install tauri-driver
      - name: 探测 Edge 版本并下载匹配的 msedgedriver
        shell: pwsh
        run: |
          $edge = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe' -ErrorAction SilentlyContinue).'(default)'
          if (-not $edge) { $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
          $version = (Get-Item $edge).VersionInfo.ProductVersion
          $major = $version.Split('.')[0]
          Write-Host "Edge 版本: $version"
          Invoke-WebRequest "https://msedgedriver.azureedge.net/$major/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          "$env:RUNNER_TEMP\edgedriver" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 构建 Tauri 应用（debug）
        working-directory: asd-tauri
        run: npm run tauri build -- --debug
      - name: 运行 E2E
        working-directory: asd-tauri/e2e
        run: npx wdio run wdio.conf.js
      - name: 上传 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: asd-tauri/e2e/reports
          if-no-files-found: warn
